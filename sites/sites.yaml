# Per-site facts for Foundational_Amplitudes. THE ONLY FILE (with
# sites/activate.sh) THAT NAMES A CLUSTER.
#
# Read by siteconf.py at import time; the site is CCORCH_SITE (exported by
# `site submit`) or sniffed from where this checkout lives. Sweep configs and
# job scripts carry only job-owned settings (time, cpus, gpu count, mem if
# non-default); everything below is filled in at generation/submit time.
ccin2p3:
  env:
    kind: venv
    # CC denies Programming_Languages/anaconda/3.11 since 2026-11 and offers no 3.11 module; torch 2.1.2 has no cp313
    # wheels, so the venv bootstraps from our own CPython 3.11.7 (uv, under /sps), the live stack reproduced in CPU job
    # 64802032 (plan entry cc_login_jobs)
    python: 'module load Programming_Languages/python/3.13.7 && { test -x /sps/lpnhe/jiturrizaramirez01/python/cpython-3.11.7-linux-x86_64-gnu/bin/python3.11 || ( U=$(mktemp -d) && python3 -m venv $U && $U/bin/pip install -q uv && UV_PYTHON_INSTALL_DIR=/sps/lpnhe/jiturrizaramirez01/python $U/bin/uv python install 3.11.7; r=$?; rm -rf $U; exit $r ); }'
    python_bin: /sps/lpnhe/jiturrizaramirez01/python/cpython-3.11.7-linux-x86_64-gnu/bin/python3.11
  project_dir: /sps/lpnhe/jiturrizaramirez01/Foundational_Amplitudes
  sweep_dir:   /sps/lpnhe/jiturrizaramirez01/Foundational_Amplitudes/sweeps
  scratch:     /sps/lpnhe/jiturrizaramirez01/tmp
  data_dir:    /sps/lpnhe/jiturrizaramirez01/datasets
  setup_commands:
    - source /sps/lpnhe/jiturrizaramirez01/Foundational_Amplitudes/sites/activate.sh
  cluster:
    scheduler: slurm
    partition: gpu_v100,gpu_h100   # either, whichever starts first; FA runs on the H100 NVL (probe 2026-10-04, torch + xformers)
    account:   lpnhe
    qos:       gpu
    gpu_flag:  "--gpus={n}"        # job_submit.lua dies on a typed --gres; --gpus is what it reads
    mem:       32G                 # MANDATORY here; a job without --mem is rejected
    max_cpus_per_gpu: 5            # "Max allowed cpus per gpu (v100): 5"
    partition_gpu_mem: {gpu_v100: 32G, gpu_h100: 94G}   # --hdr=--gpu-min-mem=80G keeps only gpu_h100 (H100 NVL)
  cpu:                             # CPU-only work (dataset prebuild): no GPU hours
    partition: htc
    account:   lpnhe
    mem_per_cpu: 2G

jeanzay:
  env:
    kind: shared
    path: /lustre/fswork/projects/rech/itg/ulm49ia/conda/envs/foundational
    activate: source /gpfslocalsup/pub/anaconda-py3/2023.09/etc/profile.d/conda.sh &&
      conda activate /lustre/fswork/projects/rech/itg/ulm49ia/conda/envs/foundational
  project_dir: /lustre/fswork/projects/rech/itg/ulm49ia/Foundational_Amplitudes
  sweep_dir:   /lustre/fswork/projects/rech/itg/ulm49ia/Foundational_Amplitudes/sweeps
  scratch:     /lustre/fsn1/projects/rech/itg/ulm49ia
  data_dir:    /lustre/fswork/projects/rech/itg/ulm49ia/datasets
  setup_commands:
    - source /lustre/fswork/projects/rech/itg/ulm49ia/Foundational_Amplitudes/sites/activate.sh
  cluster:
    scheduler: slurm
    # the A100 allocation (itg@a100, gpu_p5: 52 nodes x 8 A100-80GB), the user's call 2026-10-02: itg@v100 is in
    # over-consumption (fair share 0.08) and its jobs waited ~6.5 h with GPUs free; itg@a100 is barely used.
    # TF32 stays on (training.allow_tf32): A/B on two fixed-HP cells, TF32 on and off agree to 1-10% while
    # V100 vs A100 differ by more (docs/results.tex, sec:ladder hand-off). Every FA job fits easily.
    partition: gpu_p5
    account:   itg@a100
    constraint: a100
    gpu_flag:  "--gres=gpu:{n}"
    # no qos, no mem: Jean Zay rejects both. Host RAM scales with --cpus-per-task.
  cpu:
    partition: prepost               # weight 0: does not touch the GPU allocation
    account:   itg@v100

lxplus:
  env:
    kind: venv
    python_bin: /usr/bin/python3.11
  project_dir: /eos/user/j/joiturri/Foundational_Amplitudes
  sweep_dir:   /afs/cern.ch/user/j/joiturri/Foundational_Amplitudes/sweeps   # AFS: fcntl locks + condor submit
  results_dir: /eos/user/j/joiturri/Foundational_Amplitudes/sweeps           # EOS: bulk outputs
  scratch:     /eos/user/j/joiturri/tmp
  data_dir:    /eos/user/j/joiturri/datasets
  setup_commands:
    - source /eos/user/j/joiturri/Foundational_Amplitudes/sites/activate.sh
  cluster:
    scheduler: htcondor
    flavour:   tomorrow   # a default only: a job's flavour is the shortest covering its time (espresso 20m, microcentury 1h,
                          # longlunch 2h, workday 8h, tomorrow 1d, testmatch 3d, nextweek 1w); no 24 h cap
    mem:       32G

local:
  # a laptop / WSL checkout: paths are relative to the checkout; no scheduler
  cluster:
    scheduler: none
