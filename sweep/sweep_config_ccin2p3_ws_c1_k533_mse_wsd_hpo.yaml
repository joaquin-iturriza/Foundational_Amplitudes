# plan warm_start step (b) (D291, Joaquin 2026-11-06: "we first need to get a handle on how to tune the warm starts to
# adapt to a change before concluding if something works or not"; the method is the owner's). Same search as
# ws_c1_k533_hpo8 (sweep_config_ccin2p3_ws_c1_k533_hpo.yaml: the C1 warm start, het control's model retrained 533 steps
# on the share-0.25 recipe, base run runs/catalog_v4_short/v4_het_warm25_k533), with two changes:
# (1) the objective and checkpoint selection follow the mean, not the NLL: training.heterosc_select=mu_mse (the
#     validation MSE of mu, arithmetic mean over processes). Step (a) on hpo8's logged curves: val_mse at the best
#     checkpoint ranks the trials opposite to the NLL (lr_scale 0.17: NLL best -2.758, MSE worst 0.0349; lr_scale 2.2:
#     MSE best 0.0257), and the held-out reads followed the MSE (tuned 0.17x worse than untuned 1x, R PP4 1.19);
# (2) the schedule is searched: CosineAnnealingLR or WSD (warmup, flat, (1-sqrt) cooldown over the last
#     wsd_cooldown_frac in [0.1, 0.5]; Haegele et al. 2024 arXiv:2405.18392: 10-20% cooldown beats cosine).
# 12 trials (hpo8's 8 for 8 HPs; two more HPs), waves [4, 4, 4]. Time per trial as hpo8's (0.45 h, limit 47 min):
# 5.4 GPU-h.
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 16G           # in-memory arms' measured peak (a03d9f99)
  cpus_per_task: 5
  time: '00:47:00'
paths: null
sweep_name: ws_c1_k533_mse_wsd_hpo12
base_config: ${PROJECT_DIR}/runs/catalog_v4_short/v4_het_warm25_k533
n_trials: 12
dyhpo:
  surrogate: gp
  n_candidates: 2000
  objective_scale: auto      # the het NLL is signed
  seed: 42
  n_startup: 3
  waves: [4, 4, 4]
  total_budget: 10000
fidelity_schedule:
  t_steps:
  - 533
fixed_params:
  plot: 'true'
  training.batchsize: 16384
  evaluation.batchsize: 16384
  training.regularization: L2
  training.save_intermediate: 'false'
  training.heterosc_select: mu_mse
  training.optimizer: MuonAdamW
  data.train_subsample: 10000
  data.eval_subsample: 200
  training.validate_frac: '0.02'
  evaluation.train_subsample: 2000
  evaluate: 'false'
  training.heterosc_sigma_stage_steps: 0
  model.net.num_heads: 8
  seed: 42
range_extension:
  enabled: true
  params: [fine_tune.lr_scale]
search_space:
- name: fine_tune.lr_scale
  type: float_log
  low: 0.1
  high: 10.0
- name: fine_tune.layer_decay
  type: float_uniform
  low: 0.75
  high: 1.0
- name: training.muon_weight_decay
  type: float_log
  low: 1.0e-03
  high: 0.3
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-10
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.01
  high: 0.2
- name: training.cosanneal_eta_min
  type: float_log
  low: 1.0e-10
  high: 1.0e-07
- name: ema
  type: categorical
  choices: ["false", "true"]
- name: training.ema_decay
  type: float_uniform
  low: 0.9
  high: 0.999
- name: training.scheduler
  type: categorical
  choices: ["CosineAnnealingLR", "WSD"]
- name: training.wsd_cooldown_frac
  type: float_uniform
  low: 0.1
  high: 0.5
