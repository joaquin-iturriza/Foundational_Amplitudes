# D395 smoke of the D507 Adam/plateau sweep path: one trial, 50 steps, through the sigma stage and kit scoring.
# zng_uq_benchmark D507 protocol follow-up ('...go with less data, say 1e4 points.'): one cell of the 2x2
# {MuonAdamW+WSD, Adam+plateau} x {batch 2048, 128} at 1e4 training events of Z+4g, 400 epochs (31250 steps at
# batch 128), Adam; single-fidelity DyHPO over the B1 template's space, 8 trials, waves 3,3,2, mu_mse selection.
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 32G   # 3e6-event recipe pools in memory, float64 (the 8 runs at job_kit.sh's 32G)
  cpus_per_task: 4
  time: "00:30:00"
paths: null
sweep_name: tp_zng_d1e4_adam_smoke50_zgggg
base_config: ${PROJECT_DIR}/runs/kit/kit_A_uq_zgggg_me2_n500000_t12500
n_trials: 1
dyhpo:
  surrogate: gp
  n_candidates: 2000
  objective_scale: auto
  seed: 42
  n_startup: 1
  total_budget: 10000
  waves: [1]
fidelity_schedule:
  t_steps: [50]
fixed_params:
  data.source: recipes
  data.processes_file: ${PROJECT_DIR}/runs/kit/recipes/kit_A_uq_zgggg_me2_n500000_t12500.yaml
  data.train_subsample: 10000
  data.internal_mass_pdgs: '[23,6,25,24]'
  data.eval_subsample: 'null'
  data.memmap: 'false'
  training.dtype: float64
  training.heterosc_select: mu_mse
  evaluation.train_subsample: 2000
  seed: 42
  plot: 'true'
  warm_start_idx: 'null'
  fine_tune.pretrained_path: 'null'
  training.optimizer: Adam
  training.betas: '[0.99,0.999]'
  training.weight_decay: 0
  training.scheduler: ReduceLROnPlateau
  training.reduceplateau_factor: 0.3
  training.reduceplateau_patience: 10
  training.validate_frac: 0
  training.validate_every_n_steps: 10
  training.es_patience: 200
  training.batchsize: 128
range_extension:
  enabled: false
search_space:
- {name: training.lr, type: float_log, low: 1.5e-04, high: 1.8e-03}
- {name: training.regularization_lambda, type: float_log, low: 1.0e-10, high: 1.0e-06}
- {name: ema, type: categorical, choices: ["false", "true"]}
- {name: training.ema_decay, type: float_uniform, low: 0.9, high: 0.999}
