# critical_batch step 2 (D532, budget D536): the batch-size scan at batch 32768, 4264 steps (10.0 epochs of
# catalog_v4 base train), the v4_het_control_wsd run as base config (its setup exactly: recipe, DIM target and inputs,
# HETEROSC mean, sign head off, MuonAdamW, WSD 1/8, clip 5, seed 42, nh 8). One step schedule at every batch: warmup
# 213-853 steps (the template's frac window [0.05, 0.2] of 4264 steps, here x 4264/4264), the template's Muon lr
# window [1.667e-3, 1.5e-2], validation every 85 steps (the control's spacing), the WSD cooldown after step
# 3731, past the targets. Objective: steps to val_loss_no_reg -2.08 (the control's crossing at step 1955).
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 32G  # measured peak RSS 19.9 GB per trial (sacct, 62936975-84), margin 1.6x
  cpus_per_task: 5
  time: '03:45:00'   # need 2.45 h: steps x (0.12 s + 0.86 s x B/16384) + 5 s per validation every 85 steps + 0.2 h start-up and end (critical_batch design 2026-11-24)
  gpu_min_mem: 24G
paths: null
sweep_name: cbs_b32768
base_config: ${PROJECT_DIR}/runs/catalog_v4_short/v4_het_control_wsd
n_trials: 8
dyhpo:
  surrogate: gp
  n_candidates: 2000
  objective_scale: auto
  seed: 42
  n_startup: 3
  waves: [3, 3, 2]
  total_budget: 10000
objective: steps_to_target
objective_target: -2.08
fidelity_schedule:
  t_steps:
  - 4264
fixed_params:
  plot: 'true'
  training.batchsize: 32768
  training.batch_accumulation: 2
  evaluation.batchsize: 16384
  training.save_model_at_steps: '[]'
  training.validate_frac: '0'
  training.validate_every_n_steps: 85
  training.stop_at_val_loss: -2.30   # the last readout target: a trial ends once read (a trial never there runs its horizon)
  training.heterosc_sigma_stage_steps: 0
  find_BS: 'false'
  evaluate: 'false'
  seed: 42
search_space:
- name: training.lr
  type: float_log
  low: 0.001667
  high: 0.015
- name: training.muon_weight_decay
  type: float_log
  low: 1.0e-03
  high: 0.3
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-10
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.05
  high: 0.2
- name: training.cosanneal_eta_min
  type: float_log
  low: 1.0e-10
  high: 1.0e-07
- name: ema
  type: categorical
  choices: ["false", "true"]
- name: training.ema_decay
  type: float_uniform
  low: 0.9
  high: 0.999
