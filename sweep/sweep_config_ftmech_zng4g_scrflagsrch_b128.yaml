# finetune_mechanism (D519/D520) R1, hypothesis H1 (the parent's input flags cost Z+4g): from-scratch training WITH
# the W parent's two input flags (input_soft_eps 1e-8, input_pair_logs 7), SEARCHED as the D507 Muon b128 scratch cell
# (16 trials, waves 3,3,2,3,3,2, DyHPO seed 42, same space and lr window). Copy of sweep_config_ftmech_zng4g_ft_b128.yaml
# with the parent start removed (pretrained_path null, no fine_tune.* stats/lr options): its only difference from
# the scratch cell sweep_config_tp_zng_d1e4_muon_b128_zgggg.yaml is the two flags.
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 12G   # measured peak RSS <= 2.7 GB (lxplus condor_history of ftmech trials); 32G became 11 CPUs on lxplus and matched no slot (E8293)
  cpus_per_task: 4
  requirements: 'regexp("A100|H100", TARGET.GPUs_DeviceName) && !regexp("MIG", TARGET.GPUs_DeviceName)'   # HTCondor only: float64 trials on a Tesla T4 ran 3-6x slower (trial_0833 0.225 s/step against 0.036-0.074 on A100/H100)
  time: "02:00:00"   # A100/H100 only: ~1.06 h per trial (0.093 s/step x 31250 + sigma stage); HTCondor longlunch
paths: null
sweep_name: ftmech_zng4g_scrflagsrch_b128
base_config: ${PROJECT_DIR}/runs/kit/kit_A_uq_zgggg_me2_n500000_t12500
n_trials: 16
dyhpo:
  surrogate: gp
  n_candidates: 2000
  objective_scale: auto
  seed: 42
  n_startup: 3
  total_budget: 10000
  waves: [3, 3, 2, 3, 3, 2]
fidelity_schedule:
  t_steps: [31250]
fixed_params:
  data.source: recipes
  data.processes_file: ${PROJECT_DIR}/runs/kit/recipes/kit_A_uq_zgggg_me2_n500000_t12500.yaml
  data.train_subsample: 10000
  data.internal_mass_pdgs: '[23,6,25,24]'
  data.eval_subsample: 'null'
  data.memmap: 'false'
  training.dtype: float64
  training.heterosc_select: mu_mse
  evaluation.train_subsample: 2000
  seed: 42
  plot: 'true'
  warm_start_idx: 'null'
  fine_tune.pretrained_path: 'null'
  model.input_soft_eps: 1.0e-08
  model.input_pair_logs: 7
  training.optimizer: MuonAdamW
  training.scheduler: WSD
  training.wsd_cooldown_frac: 0.125
  training.validate_frac: 0.02
  training.batchsize: 128
range_extension:
  enabled: false
search_space:
- {name: training.lr, type: float_log, low: 2.7e-04, high: 1.1e-02}   # top 3.6e-3 tripled 2026-11-20 (extend_sweep)
- {name: training.muon_weight_decay, type: float_log, low: 1.0e-03, high: 0.3}
- {name: training.regularization_lambda, type: float_log, low: 1.0e-10, high: 1.0e-06}
- {name: training.cosanneal_warmup_frac, type: float_uniform, low: 0.05, high: 0.2}
- {name: training.cosanneal_eta_min, type: float_log, low: 1.0e-10, high: 1.0e-07}
- {name: ema, type: categorical, choices: ["false", "true"]}
- {name: training.ema_decay, type: float_uniform, low: 0.9, high: 0.999}
