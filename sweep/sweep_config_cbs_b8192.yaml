# critical_batch step 2 (D532, budget D536): the batch-size scan, batch 8192, 5 epochs of catalog_v4 base train
# (8528 steps), the v4_het_control_wsd run as base config (its setup exactly: recipe, DIM target and inputs, HETEROSC
# mean, sign head off, MuonAdamW, WSD 1/8, clip 5, seed 42, nh 8); only the batch, the steps, the searched HPs and
# the dropped step-3731 snapshot differ. lr window [c/3, 3c], c = 5e-3 x lr_c(8528)/lr_c(4264) = 0.00342 (HPO rule 2's
# horizon law scaled to the Muon search's best at 4264 steps).
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 32G  # measured peak RSS 19.9 GB per trial (sacct, 62936975-84), margin 1.6x
  cpus_per_task: 5
  time: '03:00:00'   # need: 4264 x 16384 events at 1.01 s per 16384 (tools/short_wall.py) = 1.2 h + 15 min start-up
  gpu_min_mem: 24G
paths: null
sweep_name: cbs_b8192
base_config: ${PROJECT_DIR}/runs/catalog_v4_short/v4_het_control_wsd
n_trials: 8
dyhpo:
  surrogate: gp
  n_candidates: 2000
  objective_scale: auto
  seed: 42
  n_startup: 3
  waves: [3, 3, 2]
  total_budget: 10000
fidelity_schedule:
  t_steps:
  - 8528
fixed_params:
  plot: 'true'
  training.batchsize: 8192
  training.batch_accumulation: 1
  evaluation.batchsize: 16384
  training.save_model_at_steps: '[]'
  training.validate_frac: '0.02'
  training.heterosc_sigma_stage_steps: 0
  find_BS: 'false'
  evaluate: 'false'
  seed: 42
search_space:
- name: training.lr
  type: float_log
  low: 0.001138
  high: 0.01025
- name: training.muon_weight_decay
  type: float_log
  low: 1.0e-03
  high: 0.3
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-10
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.05
  high: 0.2
- name: training.cosanneal_eta_min
  type: float_log
  low: 1.0e-10
  high: 1.0e-07
- name: ema
  type: categorical
  choices: ["false", "true"]
- name: training.ema_decay
  type: float_uniform
  low: 0.9
  high: 0.999
