# catalog_coverage step 16 (D219, D229, D231, D234, D235, D236; design passed 2026-11-01): the lr of the long width-8
# runs at 4x length (17056 steps), a single-fidelity DyHPO on the lr alone. Every trial starts from the exact resolved
# configuration of the het share-0.25 short arm (runs/catalog_v4_short/v4_het_default25: catalog_v4_train at share
# 0.25, HETEROSC with mean aggregation, the emission-scales dimensionless target D234, MuonAdamW at its search's
# muon_weight_decay 0.02171863, batch 16384, 8 blocks, num_heads 8), so a trial differs from that arm only in the lines
# below: the whole training set (train_subsample null, D236), validation 200 per process as the short arms, the memmap
# data path (data_mmap.py), 17056 steps, and the lr. The objective is the main run's best val_loss_no_reg (the sigma-only
# end stage is off in the trials: it does not move mu's checkpoint). Window [7.8e-4, 7.0e-3]: +-1/2 decade around the
# lr law's 2.34e-3 at 17056 steps (HPO rule 2). 8 trials, 3 random start-up, submitted in sequential waves. Time: the V100
# memmap probe FA-ccin2p3-08a0f39f ran 0.967 s/step at width 8 (17056 steps = 4.6 h) after a 16 min cache build.
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 46G
  cpus_per_task: 5
  time: '06:30:00'
paths: null
sweep_name: cov_v4_long_lr_x4
base_config: ${PROJECT_DIR}/runs/catalog_v4_short/v4_het_default25
n_trials: 8
dyhpo:
  n_candidates: 2000
  seed: 42
  n_startup: 3
  total_budget: 10000
  surrogate: gp
  objective_scale: linear
fidelity_schedule:
  t_steps:
  - 17056
fixed_params:
  data.train_subsample: 'null'
  data.eval_subsample: 200
  data.memmap: 'true'
  training.validate_frac: '0.02'
  evaluation.train_subsample: 2000
  evaluate: 'false'
  plot: 'true'
  training.heterosc_sigma_stage_steps: 0
  model.net.num_heads: 8
  seed: 42
range_extension:
  enabled: false
search_space:
- name: training.lr
  type: float_log
  low: 0.00078
  high: 0.007
