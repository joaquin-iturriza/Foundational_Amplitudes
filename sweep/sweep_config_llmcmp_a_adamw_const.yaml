# llm_compare part (a): muP LLoCa in the conditions of Suprio's LLM pID run (D525, D524, D526, D527), DyHPO.
# Design passed 2026-11-22 (plan llm_compare); no smoke run (D528), the scoring check runs on the first finished trial.
# Data: our regeneration of the arXiv:2606.23791 catalogue (catalog_daniel, D51/D527), his split's 1352 training
#   processes; 55,296 train events per process (the first rows, the same every epoch), validation pool 1e4.
# Updates: 60,840 steps of 24,576 events = his 20 epochs; batches mixed across processes (D526: his one-process
#   micro-batches are his implementation, not a condition of the LLM's); validation once per epoch (3042 steps).
# Target: his z = (log|M|^2 - 14.017 + 6.713 n_out)/5.303 has the form of shared_standardization +
#   affine_multiplicity_std (mean linear in the particle count, one sigma, fitted on the train split); MSE, plain mean.
# Inputs: momenta, our species encoding, alpha_s per event ((ln a + 1.994)/0.169, alphas_input); the coupling
#   powers zeroed and no physics levers or diagrams (the LLM saw species, momenta and alpha_s only; those are part (c)).
# Optimizer: AdamW at a constant lr after warmup (WSD with no cooldown), as the LLM run (constant lr); MuonAdamW and
#   WSD's cooldown belong to our latest setup, part (c). Space: the template's coupled space, Muon's decay and eta_min
#   (inert at constant lr) dropped; lr +/- 1/2 decade around 3e-3, [1e-3, 9e-3]: HPO rule 2's high-D extrapolation to
#   t = 60,840 gives 1.3e-3 (the window's bottom), but on this same catalog dancat_het_pre (32k steps, AdamW) ranked
#   its 8 trials by lr with the best, 8.9e-3, at the top of [1e-3, 9e-3] (docs/results.tex 'Pretraining on it'), so
#   the window reaches it; constant lr (no anneal) favours a lower lr than that cosine run, hence not centred above.
# Batch 24,576 is above what fits a 32 GB V100 at 16,384 (fa-canonical-setup): H100, or accumulation; smoke run decides.
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  cpus_per_task: 8
  mem: 64G
  time: "20:00:00"
  gpu_min_mem: 32G   # the design's allowed GPUs (whole GPUs >= 32 GB); no model pinned

paths:
sweep_name: llmcmp_a_adamw_const
n_trials: 8

dyhpo:
  surrogate: gp
  n_candidates: 2000
  objective_scale: auto
  seed: 42
  n_startup: 3
  total_budget: 10000
  waves: [3, 3, 2]

fidelity_schedule:
  t_steps: [60840]

fixed_params:
  data.source: recipes
  data.processes_file: recipes/catalog_daniel_train.yaml
  data.require_cache: 'true'
  data.memmap: 'true'
  data.train_subsample: 55296
  data.eval_subsample: 10000
  data.phase_space_on_pool: 'false'
  data.seed: 42
  data.preprocess_per_dataset: 'false'
  data.shared_standardization: 'true'
  data.affine_multiplicity_std: 'true'
  data.alphas_input: 'true'
  data.drop_coupling_powers: 'true'
  data.use_PIDs: 'false'
  data.spin_onehot: 'true'
  data.color_onehot: 'true'
  data.prop_is_massless: 'true'
  data.standardize_props: 'true'
  data.generation_onehot: 'true'
  data.coupling_scalars: 'false'
  data.internal_mass_scalars: 'false'
  data.offshell_per_event: 'false'
  data.target_propagators: 'false'
  model: lloca
  model.use_diagrams: 'false'
  model.particle_encoder_hidden: 0
  model.net.num_heads: 8
  model.net.num_blocks: 8
  seed: 42
  plot: 'true'
  training.batchsize: 24576
  evaluation.batchsize: 16384
  training.loss: MSE
  training.loss_aggregation: mean
  training.val_aggregation: mean
  training.sign_head: 'false'
  training.validate_frac: '0'
  training.validate_every_n_steps: 3042
  training.get_ID: 'false'
  training.regularization: L2
  training.save_intermediate: 'false'
  training.optimizer: AdamW
  training.scheduler: WSD
  training.wsd_cooldown_frac: 0.0

search_space:
- name: training.lr
  type: float_log
  low: 1.0e-03      # [c/3, 3c] around c = 3e-3 (header)
  high: 9.0e-03
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-10
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.05
  high: 0.2
- name: ema
  type: categorical
  choices: ["false", "true"]
- name: training.ema_decay
  type: float_uniform
  low: 0.9
  high: 0.999
