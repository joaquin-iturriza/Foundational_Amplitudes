# plan warm_start step 3 (D284, Joaquin 2026-11-05: "I'd fix it and 1/8 and do a bit of a sweep, in particular lr, to
# see how aggresive we can make the improvement"; D286: no matched control; design passed 2026-11-05T02:09). One
# single-fidelity DyHPO search (HPO rule 6) of the C1 warm start: the het control's model retrained 533 steps (1/8 of
# the 4264-step pretraining) on the share-0.25 recipe. Every trial starts from the resolved configuration of the warm
# arm runs/catalog_v4_short/v4_het_warm25_k533 (scripts/job_catalog_v3_short.sh @7f945910: fine_tune.pretrained_path
# = the het control's best mean-stage model, target_stats parent, catalog_v4_default25_train, 1e4 train / 200 val per
# pool in memory, width 8, MuonAdamW, batch 16384, HETEROSC, cosine, seed 42), so a trial differs from it only in the
# searched HPs below, the sigma stage off and evaluate off (the objective: the main run's best val_loss_no_reg).
# Space: the template's fine-tune space (HPO rules 3-4): lr through fine_tune.lr_scale [0.1, 10] around the parent's
# lr 4.997e-3, layer_decay [0.75, 1], the template's coupled HPs; warmup low end 0.01 (template 0.05): a re-warm is
# insensitive to warmup length in the continual-pretraining literature, and 0.158 of 533 steps is 84 steps.
# Time: 533 steps in 11.9 min incl. validations on V100 (FA-ccin2p3-341bf564) + 11.7 min data load + 2 min end
# = 0.45 h per trial (target); limit 1.5x + 6 min = 47 min. 8 trials, 3.6 GPU-h.
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 16G           # in-memory arms' measured peak (a03d9f99)
  cpus_per_task: 5
  time: '00:47:00'
paths: null
sweep_name: ws_c1_k533_hpo8
base_config: ${PROJECT_DIR}/runs/catalog_v4_short/v4_het_warm25_k533
n_trials: 8
dyhpo:
  surrogate: gp
  n_candidates: 2000
  objective_scale: auto      # the het NLL is signed
  seed: 42
  n_startup: 3
  waves: [3, 3, 2]
  total_budget: 10000
fidelity_schedule:
  t_steps:
  - 533
fixed_params:
  plot: 'true'
  training.batchsize: 16384
  evaluation.batchsize: 16384
  training.regularization: L2
  training.save_intermediate: 'false'
  training.scheduler: CosineAnnealingLR
  training.optimizer: MuonAdamW
  data.train_subsample: 10000
  data.eval_subsample: 200
  training.validate_frac: '0.02'
  evaluation.train_subsample: 2000
  evaluate: 'false'
  training.heterosc_sigma_stage_steps: 0
  model.net.num_heads: 8
  seed: 42
range_extension:
  enabled: true
  params: [fine_tune.lr_scale]
search_space:
- name: fine_tune.lr_scale
  type: float_log
  low: 0.1
  high: 10.0
- name: fine_tune.layer_decay
  type: float_uniform
  low: 0.75
  high: 1.0
- name: training.muon_weight_decay
  type: float_log
  low: 1.0e-03
  high: 0.3
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-10
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.01
  high: 0.2
- name: training.cosanneal_eta_min
  type: float_log
  low: 1.0e-10
  high: 1.0e-07
- name: ema
  type: categorical
  choices: ["false", "true"]
- name: training.ema_decay
  type: float_uniform
  low: 0.9
  high: 0.999
