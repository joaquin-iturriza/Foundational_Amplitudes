# critical_batch D563 (Joaquin 2026-11-25: "repeat these trainings at ~50 epochs ... retuning some HPs"): ftmech_zng4g_ftnoset_b2048
# at 50 epochs of its 1e4 events (244 steps at batch 2048, was 1953), the same space, seed, waves and trial count;
# the lr window moved by HPO rule 2's horizon factor (an estimate); everything else as ftmech_zng4g_ftnoset_b2048.
# finetune_mechanism (D519/D520, Joaquin 2026-11-23): the W parent retrained WITHOUT its two input settings
# (scripts/job_datasaving_parent.sh finale flags=off, tag=zng_uq_w_noset_lr1p89e-3), fine-tuned on Z+4g, searched as the
# current fine-tune sweep_config_ftmech_zng4g_ft_b2048.yaml's first 16 trials (same space and lr window, waves, seed);
# only the parent and the two settings (off, as scratch's) differ.
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 12G   # measured peak RSS <= 2.7 GB (lxplus condor_history of ftmech trials); 32G became 11 CPUs on lxplus and matched no slot (E8293)
  cpus_per_task: 4
  requirements: 'regexp("A100|H100", TARGET.GPUs_DeviceName) && !regexp("MIG", TARGET.GPUs_DeviceName)'   # HTCondor only: float64 trials on a Tesla T4 ran 3-6x slower (trial_0833 0.225 s/step against 0.036-0.074 on A100/H100)
  time: "00:30:00"   # need ~0.1 h per trial: the 400-epoch trials ran 0.086 s/step at batch 128 on V100 (registry), plus the 250-step sigma stage and start-up
paths: null
sweep_name: ftmech_zng4g_ftnoset_b2048_ep50
base_config: ${PROJECT_DIR}/runs/kit/kit_A_uq_zgggg_me2_n500000_t12500
n_trials: 16   # the trial count of ftmech_zng4g_ftnoset_b2048 (its collected trials, d507_search_v2.json / ft_bcrit.json)
dyhpo:
  surrogate: gp
  n_candidates: 2000
  objective_scale: auto
  seed: 42
  n_startup: 3
  total_budget: 10000
  waves: [3, 3, 2, 3, 3, 2]
fidelity_schedule:
  t_steps: [244]
fixed_params:
  data.source: recipes
  data.processes_file: ${PROJECT_DIR}/runs/kit/recipes/kit_A_uq_zgggg_me2_n500000_t12500.yaml
  data.train_subsample: 10000
  data.internal_mass_pdgs: '[23,6,25,24]'
  data.eval_subsample: 'null'
  data.memmap: 'false'
  training.dtype: float64
  training.heterosc_select: mu_mse
  evaluation.train_subsample: 2000
  seed: 42
  plot: 'true'
  warm_start_idx: 'null'
  fine_tune.pretrained_path: ${PROJECT_DIR}/runs/data_saving/dsave_parent_finale_zng_uq_w_noset_lr1p89e-3/models/model_run0_best.pt.gz
  fine_tune.target_stats: own
  fine_tune.offshell_stats: parent
  fine_tune.lr_scale: 1.0
  fine_tune.layer_decay: 1.0
  model.input_soft_eps: 0.0
  model.input_pair_logs: 0
  training.optimizer: MuonAdamW
  training.scheduler: WSD
  training.wsd_cooldown_frac: 0.125
  training.validate_frac: 0.02
  training.batchsize: 2048
range_extension:
  enabled: false
search_space:
- {name: training.lr, type: float_log, low: 1.10e-03, high: 1.45e-02}   # ftmech_zng4g_ftnoset_b2048's window x 0.353 (HPO rule 2's lr_c(t) from 1953 to 244 steps)
- {name: training.muon_weight_decay, type: float_log, low: 1.0e-03, high: 0.3}
- {name: training.regularization_lambda, type: float_log, low: 1.0e-10, high: 1.0e-06}
- {name: training.cosanneal_warmup_frac, type: float_uniform, low: 0.05, high: 0.2}
- {name: training.cosanneal_eta_min, type: float_log, low: 1.0e-10, high: 1.0e-07}
- {name: ema, type: categorical, choices: ["false", "true"]}
- {name: training.ema_decay, type: float_uniform, low: 0.9, high: 0.999}
