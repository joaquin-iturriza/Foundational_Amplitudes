cluster:
  scheduler: slurm
  auto_submit: false
  partition: gpu_p2          # V100 32GB (15k hours); try gpu_p13 + itg@a100 for A100 (5k hours)
  account: itg@v100
  request_gpus: 1
  cpus_per_task: 8
  time: "20:00:00"

paths:
  sweep_dir: /lustre/fswork/projects/rech/itg/ulm49ia/Foundational_Amplitudes/sweeps
  project_dir: /lustre/fswork/projects/rech/itg/ulm49ia/Foundational_Amplitudes
  setup_commands:
    - "module load anaconda-py3/2023.09"
    - "conda activate /lustre/fswork/projects/rech/itg/ulm49ia/conda/envs/foundational"

sweep_name: my_sweep_name
n_trials: 40

dyhpo:
  n_candidates: 300
  seed: 42
  n_startup: 10
  total_budget: 10000

fidelity_schedule:
  t_steps: [1000, 10000, 40000]

fixed_params:
  data.data_path: /lustre/fswork/projects/rech/itg/ulm49ia/Foundational_Amplitudes/data/
  data.dataset: '[ee_uu_91GeV_amplitudes]'
  model: lloca
  plot: 'true'
  training.batchsize: 16384          # decided operating point: biggest BS that fits (nh<=8, V100 32GB)
  evaluation.batchsize: 16384        # eval forward-only -> match train BS, never eval slower
  training.loss_aggregation: geometric_mean
  training.validate_frac: '0.01'     # 100 val points regardless of horizon; never hand-set validate_every_n_steps
  training.get_ID: 'false'
  training.regularization: L2
  training.save_intermediate: 'false'
  training.scheduler: CosineAnnealingLR

# Search space centred on the empirical HPO optima (422 converged sweeps; see
# docs/results.tex sec:lrlaw). lr obeys the inverted-U law across horizon and
# transfers across width (muP) -- NEVER re-sweep lr per width.
#
# lr CENTRE: evaluate the measured 2D surface eta*(t,D) at YOUR (t,D) and sweep
# +/-1/2 decade [c/3, 3c]. Do NOT use a static band, and do NOT collapse to the
# t-only lr_center(t) -- that discards the measured D-axis. Every real run sits
# past the peak (t*=3000 steps), so the centre DECREASES with horizon; a large-D
# run sits at the high-D asymptote so its centre is ABOVE the D-pooled value (read
# the high-D row of analysis/hpo_optima/hpo_optima.json). For a big foundation run
# (per-proc D~30-100k) the (high-D,high-t) corner is off the measured grid, so the
# centre is an extrapolation of the high-D decay: ~2e-3 @30k, ~1.4e-3 @50k, ~9e-4
# @100k steps. The band below is a wide default for when (t,D) are not yet fixed.
# (There is NO "is the loss floored?" test -- never a measured axis; only t and D.)
search_space:
- name: training.lr
  type: float_log
  low: 1.0e-03      # default band [1e-3, 3e-2]; replace with [c/3, 3c] once (t,D) are set
  high: 3.0e-02
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-10      # optima p5-p95 within [2.5e-11, 9.8e-7]; cap high at 1e-6
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.05         # optima median 0.15; floor at 0.05 (was 0.0)
  high: 0.2
- name: training.cosanneal_eta_min
  type: float_log
  low: 1.0e-10      # weakest knob, spans full range; narrow (or fix ~1e-8)
  high: 1.0e-07
# EMA (weight averaging) is UNTESTED -- gated by top-level `ema` (default false), so
# it has never been active. Test it properly here: ema=false is "no EMA at all",
# ema=true uses ema_decay. Choices are strings so the Hydra override is lowercase
# (ema=true/false); once settled, fix `ema` and drop from the search.
- name: ema
  type: categorical
  choices: ["false", "true"]
- name: training.ema_decay
  type: float_uniform
  low: 0.9          # inert on ema=false trials; ~100-10000 step averaging horizon when on
  high: 0.9999
