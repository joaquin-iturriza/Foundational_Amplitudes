# D68 (the user: "going from 5 to 1000 and then to no clipping is a bit extreme I think, maybe sweeping the value is
# better?"): sweep_config_tp_het_ee_ttbar_d8.yaml verbatim (same 8 trials, waves 3+3+2, 2000 candidates, GP, NLL
# objective) with training.clip_grad_norm added to the search space, log-uniform [1, 1000]: the het sweep ran with the
# fixed 5, which binds on 100% of steps (pre-clip median norm 417 at 8k), and clipping interacts with lr.
# The user's heteroscedastic loss (losses.heteroscedastic_loss, plain Gaussian NLL, heterosc_beta=0) on the scratch
# probe cell tp_scr_ee_ttbar_d8 (ee_ttbar, D = 10^4 events, 8000 steps): its fixed params and search space copied
# verbatim from sweep_config_tp_scr_ee_ttbar_d8.yaml (= runs/tp_scr_ee_ttbar_d8/trial_0144/config.yaml on CC), with
#   training.loss=HETEROSC, heterosc_beta=0, heterosc_select=nll (checkpoint and DyHPO objective: the validation NLL,
#   the user's "rank on the NLL"), model.net.sigma_after_pool=true, detach_sigma_backbone=false,
#   training.sign_head=false (positive probe; asserted incompatible with HETEROSC), training.track_train_eval=true;
#   dyhpo: plain GP surrogate, 2000 candidates, 8 trials (the user's "GP, 8 trials, 2000 candidates"),
#   objective_scale linear (the NLL is signed), whole waves 3 (random start-up) + 3 + 2, run by sweep/drive.py.
# Its val_loss is an NLL, not comparable to the MSE sweep's val_loss_no_reg; the MSE-side numbers are in the result
# JSON's val_mse curve (mu-MSE) and proc_val_losses.
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 8G
  cpus_per_task: 4
  time: 02:00:00
paths: null
sweep_name: tp_het_clip_ee_ttbar_d8
n_trials: 8
dyhpo:
  n_candidates: 2000
  seed: 42
  n_startup: 3
  total_budget: 10000
  surrogate: gp
  objective_scale: linear
  waves:
  - 3
  - 3
  - 2
fidelity_schedule:
  t_steps:
  - 8000
fixed_params:
  data.source: recipes
  data.require_cache: 'false'
  data.eval_subsample: 10000
  data.phase_space_on_pool: 'true'
  data.preprocess_per_dataset: 'true'
  data.signedlog_quantile: 0.01
  data.seed: 42
  data.use_PIDs: 'false'
  data.spin_onehot: 'true'
  data.color_onehot: 'true'
  data.prop_is_massless: 'true'
  data.standardize_props: 'true'
  data.generation_onehot: 'true'
  data.generation_feature: 'true'
  data.mass_from_momenta: 'false'
  data.coupling_scalars: 'true'
  data.internal_mass_scalars: 'true'
  data.offshell_per_event: 'true'
  data.target_propagators: 'true'
  data.target_propagator_tchannel: 'true'
  data.target_propagator_tchannel_max_final: 2
  data.internal_mass_pdgs: '[23,6,25]'
  model: lloca
  model.use_diagrams: 'false'
  model.particle_encoder_hidden: 0
  model.net.num_heads: 8
  model.net.num_blocks: 8
  seed: 42
  training.batchsize: 16384
  evaluation.batchsize: 16384
  evaluation.train_subsample: 2000
  training.loss_aggregation: mean
  training.sign_head: 'false'
  training.loss: HETEROSC
  training.heterosc_beta: 0.0
  training.heterosc_select: nll
  model.net.sigma_after_pool: 'true'
  model.net.detach_sigma_backbone: 'false'
  training.track_train_eval: 'true'
  training.val_aggregation: geometric_mean
  training.regularization: L2
  training.scheduler: CosineAnnealingLR
  training.get_ID: 'false'
  training.save_intermediate: 'false'
  training.validate_frac: '0.01'
  training.es_load_best_model: 'true'
  training.dtype: float32
  plot: 'true'
  use_mlflow: 'false'
  data.processes_file: ${PROJECT_DIR}/recipes/transfer_probe_ee_ttbar.yaml
  data.train_subsample: 10000
range_extension:
  enabled: false
search_space:
- name: training.clip_grad_norm
  type: float_log
  low: 1.0
  high: 1000.0
- name: training.lr
  type: float_log
  low: 9.12e-05
  high: 0.00912
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-10
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.05
  high: 0.2
- name: training.cosanneal_eta_min
  type: float_log
  low: 1.0e-10
  high: 1.0e-07
- name: ema
  type: categorical
  choices:
  - 'false'
  - 'true'
- name: training.ema_decay
  type: float_uniform
  low: 0.9
  high: 0.999
