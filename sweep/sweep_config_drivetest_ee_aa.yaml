# 4 x 63-step trials of ee_aa across sites: the end-to-end test of sweep/drive.py (not a result).
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 8G
  cpus_per_task: 4
  time: 00:15:00
paths: null
sweep_name: drivetest_ee_aa
n_trials: 4
dyhpo:
  n_candidates: 200
  seed: 42
  n_startup: 2
  total_budget: 10000
fidelity_schedule:
  t_steps:
  - 63
fixed_params:
  data.source: recipes
  data.processes_file: ${PROJECT_DIR}/recipes/ref_solo_ee_aa.yaml
  data.require_cache: 'true'
  data.eval_subsample: 2000
  data.preprocess_per_dataset: 'true'
  data.signedlog_quantile: 0.01
  data.seed: 42
  data.use_PIDs: 'false'
  data.spin_onehot: 'true'
  data.color_onehot: 'true'
  data.prop_is_massless: 'true'
  data.standardize_props: 'true'
  data.generation_onehot: 'true'
  data.generation_feature: 'true'
  data.mass_from_momenta: 'true'
  data.coupling_scalars: 'true'
  data.internal_mass_scalars: 'true'
  data.offshell_per_event: 'true'
  data.target_propagators: 'true'
  data.target_propagator_tchannel: 'true'
  data.target_propagator_tchannel_max_final: 2
  data.internal_mass_pdgs: '[23,6,25]'
  model: lloca
  model.use_diagrams: 'false'
  model.particle_encoder_hidden: 0
  model.net.num_heads: 8
  model.net.num_blocks: 8
  seed: 42
  training.batchsize: 1024
  evaluation.batchsize: 1024
  evaluation.train_subsample: 2000
  training.loss_aggregation: mean
  training.sign_head: 'true'
  training.val_aggregation: geometric_mean
  training.regularization: L2
  training.scheduler: CosineAnnealingLR
  training.get_ID: 'false'
  training.save_intermediate: 'false'
  training.validate_frac: '0.05'
  training.dtype: float32
  plot: 'false'
  use_mlflow: 'false'
  training.cosanneal_eta_min: 0.0
  training.regularization_lambda: 1.0e-08
  ema: 'false'
range_extension:
  enabled: false
search_space:
- name: training.lr
  type: float_log
  low: 0.00238
  high: 0.0238
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.05
  high: 0.2
