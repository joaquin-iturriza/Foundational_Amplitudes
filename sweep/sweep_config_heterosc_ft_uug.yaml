cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  cpus_per_task: 8
  time: "01:30:00"

paths:
  # empty: project_dir, sweep_dir and data_dir come from siteconf (sites/sites.yaml) for the site it runs on. The
  # HETEROSC 2-ch head, beta-NLL, mean aggregation and detach knob it needs are on trunk. July 2026 config of the
  # heterosc divergence study (docs/results.tex sec:div-sampling), kept as run.

# Fair Bayesian (DyHPO) HPO for the COUPLED beta=1 heteroscedastic uug finetune.
# Diagnosis (analysis/divergences/diag_ckpt_mu.py) ruled out checkpoint selection
# (best==last) and sigma-inflation (sigma calibrated); the coupled foundation fits mu
# (0.025 ~= MSE 0.020) but the single-process uug finetune underfits (0.086) and even
# fully decoupled (detach_sigma_backbone) only reaches 0.0315 vs the MSE finetune's
# 8.5e-5. That residual points at the finetune OPTIMISER/HPs (lr_scale, layer_decay,
# warmup), which were borrowed from the MSE recipe and never tuned for the NLL. This
# sweep keeps sigma COUPLED (detach off) and asks: can the coupled loss fit mu like MSE
# with proper HPs? DyHPO objective = best val_loss_no_reg (beta-NLL); winners re-ranked
# on mu-MSE post-hoc (rank_mu_mse.py) for the like-with-like comparison to MSE (8.5e-5).
sweep_name: heterosc_ft_uug
n_trials: 16

dyhpo:
  n_candidates: 100
  seed: 42
  n_startup: 6
  total_budget: 40

# SINGLE fidelity at the matched horizon (= the MSE antenna finetune's 4000 steps, where
# it hits 8.5e-5). We use DyHPO as a one-fidelity Bayesian optimiser (project convention;
# see CLAUDE.md "single-fidelity Bayesian optimiser") — every trial trains the full 4000
# steps, no low-fidelity ladder.
fidelity_schedule:
  t_steps: [4000]

fixed_params:
  # --- data: dense-IR antenna uug pool, per-dataset preprocessing (matches ft_deep_antenna) ---
  data.source: files
  data.data_path: ${PROJECT_DIR}/data_deep_antenna/
  data.dataset: '[ee_uug_91-1000GeV_amplitudes]'
  data.preprocess_per_dataset: 'true'
  data.train_test_val: '[0.9, 0.05, 0.05]'
  data.subsample: null
  # --- model: LLoCa, matches the HETEROSC foundation architecture (diagram-free) ---
  model: lloca
  model.net.num_blocks: 8
  model.net.num_heads: 8
  model.use_diagrams: 'false'
  model.particle_encoder_hidden: 0
  model.net.detach_sigma_backbone: 'false'   # COUPLED (faithful) — the whole point
  # --- warm start from the best HETEROSC foundation (lr4e-3, beta1; both sides 2-ch, no head reset) ---
  fine_tune.pretrained_path: ${PROJECT_DIR}/runs/heterosc_foundation/het_lr0.004_b1.0/models/model_run0_best.pt
  # --- HETEROSC loss ---
  training.loss: HETEROSC
  training.heterosc_beta: 1.0
  training.lr: 0.004                 # fixed at the foundation lr; fine_tune.lr_scale is the swept step lever
  training.batchsize: 16384
  evaluation.batchsize: 16384
  training.scheduler: CosineAnnealingLR
  training.cosanneal_eta_min: 1.0e-8   # weakest knob — fixed
  training.regularization: L2
  training.validate_frac: '0.01'
  training.get_ID: 'false'
  training.save_intermediate: 'false'
  plot: 'true'

# Search space per the finetune HPO rules (CLAUDE.md / docs/results.tex sec:optimization).
# lr_scale is the primary lever (effective finetune step); centred at 1, wide log band.
search_space:
- name: fine_tune.lr_scale
  type: float_log
  low: 0.1
  high: 10.0
- name: fine_tune.layer_decay
  type: float_uniform
  low: 0.75
  high: 1.0
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-10
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.05
  high: 0.2
