# critical_batch step 2, D395 smoke of the batch-32768 accumulation path (2 micro-batches of 16384) through the sweep
# path: sweep_config_cbs_b32768.yaml at 50 steps, one trial, validation every 25 steps, objective target 100 (reached
# at the first validation, so steps_to_target runs to its end); every other setting as the b32768 sweep.
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 32G  # measured peak RSS 19.9 GB per trial (sacct, 62936975-84), margin 1.6x
  cpus_per_task: 5
  time: '00:45:00'   # need ~0.3 h: 50 steps x 1.84 s + 2 validations + 0.2 h start-up and end
  gpu_min_mem: 24G
paths: null
sweep_name: cbs_smoke_b32768
base_config: ${PROJECT_DIR}/runs/catalog_v4_short/v4_het_control_wsd
n_trials: 1
dyhpo:
  surrogate: gp
  n_candidates: 2000
  objective_scale: auto
  seed: 42
  n_startup: 1
  waves: [1]
  total_budget: 10000
objective: steps_to_target
objective_target: 100.0
fidelity_schedule:
  t_steps:
  - 50
fixed_params:
  plot: 'true'
  training.batchsize: 32768
  training.batch_accumulation: 2
  evaluation.batchsize: 16384
  training.save_model_at_steps: '[]'
  training.validate_frac: '0'
  training.validate_every_n_steps: 25
  training.heterosc_sigma_stage_steps: 0
  find_BS: 'false'
  evaluate: 'false'
  seed: 42
search_space:
- name: training.lr
  type: float_log
  low: 0.001667
  high: 0.015
- name: training.muon_weight_decay
  type: float_log
  low: 1.0e-03
  high: 0.3
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-10
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.05
  high: 0.2
- name: training.cosanneal_eta_min
  type: float_log
  low: 1.0e-10
  high: 1.0e-07
- name: ema
  type: categorical
  choices: ["false", "true"]
- name: training.ema_decay
  type: float_uniform
  low: 0.9
  high: 0.999
