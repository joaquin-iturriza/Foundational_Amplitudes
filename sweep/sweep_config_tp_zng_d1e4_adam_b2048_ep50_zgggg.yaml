# critical_batch D563 (Joaquin 2026-11-25: "repeat these trainings at ~50 epochs ... retuning some HPs"): tp_zng_d1e4_adam_b2048_zgggg
# at 50 epochs of its 1e4 events (244 steps at batch 2048, was 1953), the same space, seed, waves and trial count;
# the lr window moved by HPO rule 2's horizon factor (an estimate); everything else as tp_zng_d1e4_adam_b2048_zgggg.
# zng_uq_benchmark D507 protocol follow-up ('...go with less data, say 1e4 points.'): one cell of the 2x2
# {MuonAdamW+WSD, Adam+plateau} x {batch 2048, 128} at 1e4 training events of Z+4g, 400 epochs (1953 steps at
# batch 2048), Adam; single-fidelity DyHPO over the B1 template's space, 8 trials, waves 3,3,2, mu_mse selection.
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 32G   # 3e6-event recipe pools in memory, float64 (the 8 runs at job_kit.sh's 32G)
  cpus_per_task: 4
  requirements: 'regexp("A100|H100", TARGET.GPUs_DeviceName) && !regexp("MIG", TARGET.GPUs_DeviceName)'   # HTCondor only: float64 trials on a Tesla T4 ran 3-6x slower (trial_0833 0.225 s/step against 0.036-0.074 on A100/H100)
  time: "00:30:00"   # need ~0.1 h per trial: the 400-epoch batch-2048 Fn trials ran 0.03-0.20 h for 1953 steps (registry, H100-V100), so 244 steps take <=0.03 h, plus the 250-step sigma stage and start-up
paths: null
sweep_name: tp_zng_d1e4_adam_b2048_ep50_zgggg
base_config: ${PROJECT_DIR}/runs/kit/kit_A_uq_zgggg_me2_n500000_t12500
n_trials: 19   # the trial count of tp_zng_d1e4_adam_b2048_zgggg (its collected trials, d507_search_v2.json / ft_bcrit.json)
dyhpo:
  surrogate: gp
  n_candidates: 2000
  objective_scale: auto
  seed: 42
  n_startup: 3
  total_budget: 10000
  waves: [3, 3, 2, 3, 3, 2, 3]
fidelity_schedule:
  t_steps: [244]
fixed_params:
  data.source: recipes
  data.processes_file: ${PROJECT_DIR}/runs/kit/recipes/kit_A_uq_zgggg_me2_n500000_t12500.yaml
  data.train_subsample: 10000
  data.internal_mass_pdgs: '[23,6,25,24]'
  data.eval_subsample: 'null'
  data.memmap: 'false'
  training.dtype: float64
  training.heterosc_select: mu_mse
  evaluation.train_subsample: 2000
  seed: 42
  plot: 'true'
  warm_start_idx: 'null'
  fine_tune.pretrained_path: 'null'
  training.optimizer: Adam
  training.betas: '[0.99,0.999]'
  training.weight_decay: 0
  training.scheduler: ReduceLROnPlateau
  training.reduceplateau_factor: 0.3
  training.reduceplateau_patience: 10
  training.validate_frac: 0
  training.validate_every_n_steps: 1
  training.es_patience: 20
  training.batchsize: 2048
range_extension:
  enabled: false
search_space:
- {name: training.lr, type: float_log, low: 4.95e-04, high: 6.36e-03}   # tp_zng_d1e4_adam_b2048_zgggg's window x 0.353 (HPO rule 2's lr_c(t) from 1953 to 244 steps)
- {name: training.regularization_lambda, type: float_log, low: 1.0e-10, high: 1.0e-06}
- {name: ema, type: categorical, choices: ["false", "true"]}
- {name: training.ema_decay, type: float_uniform, low: 0.9, high: 0.999}
