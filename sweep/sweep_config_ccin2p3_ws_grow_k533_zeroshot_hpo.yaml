# plan warm_start step 11 (D285: the width growth 8->16 heads; D291: tuning a warm start to its change): the growth's
# own tuning sweep. Base run: the default growth at k=533 (runs/catalog_v4_long/v4_het_default25_w16_grow_k533, seed
# 42, FA-ccin2p3-e046ac67: the w8 x1 cell's final model grown function-preservingly by fine_tune.grow_width and
# retrained 533 steps on its own setup, the schedule restarted). Search space and budget as ws_c1_k533_mse_wsd_hpo8
# (the template's fine-tune space plus the schedule, 8 trials, 3 start-up, waves [3, 3, 2]). The objective is not a
# validation loss: on 13 comparisons of restarts (analysis/catalog_v4/ws_objective_check.py, data/
# ws_objective_check.json) every in-run validation quantity ran against the deciding PP4/EE4 reads (val NLL r
# -0.68/-0.80, val MSE of the mean -0.46/-0.62), and only the zero-shot MSE on the default-sampled held-out tree
# classes HD4 (no PP4/EE4 class) tracked them (score_HD4: r 0.94/0.92 chosen, 0.97/0.98 confirmed). So each trial's
# model (its best checkpoint, as every read) is read zero-shot on HD4's test pools after training
# (sweep/run_trial.py zero_shot_objective) and DyHPO observes zero_shot_score: the geometric mean over HD4's classes
# of the class geometric mean MSE of log|M|^2. PP4/EE4 stay the deciding reads, never used in the selection.
# Time per trial: 533 steps x 1.703 s (31359864's V3_WALL rate) = 15 min of training plus 114 probes x 1.45 s = 3 min
# of read, about 0.30 h of work; limit 00:50:00 with the 15 min start-up. 8 trials: about 4 GPU-h (6.7 at limits).
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 32G          # the growth jobs' peak 16.5-23.9 GB (sacct 62977053, 62990038, reads included)
  cpus_per_task: 5
  time: '00:50:00'
paths: null
# ws_grow_k533_zeroshot_hpo8 (2026-11-06 ~13:11 UTC) failed whole: its base run's config.yaml had been rewritten by
# the cache prebuild (memmap_prebuild true, num_workers 0), so each trial opened the cache and exited with no result.
# Re-run under a new name with the two keys set back to the run's own values (its seed-43 twin's config).
sweep_name: ws_grow_k533_zeroshot_hpo8_rerun
base_config: ${PROJECT_DIR}/runs/catalog_v4_long/v4_het_default25_w16_grow_k533
objective: zero_shot_score
zero_shot_objective:
  recipe: recipes/catalog_v4_heldout_default_test.yaml
  split: test
  eval_subsample: 2000
n_trials: 8
dyhpo:
  surrogate: gp
  n_candidates: 2000
  objective_scale: auto
  seed: 42
  n_startup: 3
  waves: [3, 3, 2]
  total_budget: 10000
fidelity_schedule:
  t_steps:
  - 533
fixed_params:
  plot: 'true'
  training.batchsize: 16384
  evaluation.batchsize: 16384
  training.regularization: L2
  training.save_intermediate: 'false'
  training.optimizer: MuonAdamW
  data.eval_subsample: 200
  training.validate_frac: '0.02'
  evaluation.train_subsample: 2000
  evaluate: 'false'
  training.heterosc_sigma_stage_steps: 0
  model.net.num_heads: 16
  data.memmap_prebuild: 'false'
  training.num_workers: 2
  seed: 42
range_extension:
  enabled: true
  params: [fine_tune.lr_scale]
search_space:
- name: fine_tune.lr_scale
  type: float_log
  low: 0.1
  high: 10.0
- name: fine_tune.layer_decay
  type: float_uniform
  low: 0.75
  high: 1.0
- name: training.muon_weight_decay
  type: float_log
  low: 1.0e-03
  high: 0.3
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-10
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.01
  high: 0.2
- name: training.cosanneal_eta_min
  type: float_log
  low: 1.0e-10
  high: 1.0e-07
- name: ema
  type: categorical
  choices: ["false", "true"]
- name: training.ema_decay
  type: float_uniform
  low: 0.9
  high: 0.999
- name: training.scheduler
  type: categorical
  choices: ["CosineAnnealingLR", "WSD"]
- name: training.wsd_cooldown_frac
  type: float_uniform
  low: 0.1
  high: 0.5
