# Continual add-W, forgetting along the run (D30): the finale fine-tuned 1000 steps on W+4g, W+5g (ewc), the finale's 28
# processes as monitors (recipes/transfer_wng_add_monitor.yaml); a 5-trial search as the 16k step (D26).
# Copied by hand from the corresponding uubar_Zggg / tp3_finale config written by sweep/gen_transfer_pilot.py (2026-10-09).
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 16G
  cpus_per_task: 4
  chain_width: 2
  time: 08:00:00
paths: null
sweep_name: tp3_waddm_ewc1k
n_trials: 5
dyhpo:
  n_candidates: 200
  seed: 1906528123
  n_startup: 3
  total_budget: 10000
fidelity_schedule:
  t_steps:
  - 1000
fixed_params:
  data.source: recipes
  data.require_cache: 'false'
  data.eval_subsample: 10000
  data.phase_space_on_pool: 'true'
  data.preprocess_per_dataset: 'true'
  data.signedlog_quantile: 0.01
  data.seed: 42
  data.use_PIDs: 'false'
  data.spin_onehot: 'true'
  data.color_onehot: 'true'
  data.prop_is_massless: 'true'
  data.standardize_props: 'true'
  data.generation_onehot: 'true'
  data.generation_feature: 'true'
  data.mass_from_momenta: 'false'
  data.coupling_scalars: 'true'
  data.internal_mass_scalars: 'true'
  data.offshell_per_event: 'true'
  data.target_propagators: 'false'
  data.target_propagator_tchannel: 'false'
  data.target_propagator_tchannel_max_final: 2
  data.internal_mass_pdgs: '[23,6,25]'
  model: lloca
  model.use_diagrams: 'false'
  model.particle_encoder_hidden: 0
  model.net.num_heads: 8
  model.net.num_blocks: 8
  seed: 42
  training.batchsize: 16384
  evaluation.batchsize: 16384
  evaluation.train_subsample: 2000
  training.loss_aggregation: mean
  training.sign_head: 'true'
  training.val_aggregation: geometric_mean
  training.regularization: L2
  training.scheduler: CosineAnnealingLR
  training.get_ID: 'false'
  training.save_intermediate: 'false'
  training.validate_frac: '0.01'
  training.es_load_best_model: 'true'
  training.dtype: float32
  plot: 'true'
  use_mlflow: 'false'
  data.processes_file: ${PROJECT_DIR}/recipes/transfer_wng_add_monitor.yaml
  fine_tune.lr_scale: 1.0
  fine_tune.layer_decay: 1.0
  fine_tune.pretrained_path: /eos/user/j/joiturri/Foundational_Amplitudes/runs/tp3_finale/trial_0073/models/model_run0_best.pt
  fine_tune.target_stats: own
  fine_tune.offshell_stats: parent
  fine_tune.ewc.enabled: 'true'
  fine_tune.ewc.fisher_path: ${PROJECT_DIR}/runs/tp3_finale/trial_0073/models/ewc_fisher.pt
range_extension:
  enabled: false
search_space:
- name: fine_tune.ewc.lambda
  type: float_log
  low: 100.0
  high: 1.0e+07
- name: training.lr
  type: float_log
  low: 0.001
  high: 0.01
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-10
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.05
  high: 0.2
- name: training.cosanneal_eta_min
  type: float_log
  low: 1.0e-10
  high: 1.0e-07
- name: ema
  type: categorical
  choices:
  - 'false'
  - 'true'
- name: training.ema_decay
  type: float_uniform
  low: 0.9
  high: 0.999
