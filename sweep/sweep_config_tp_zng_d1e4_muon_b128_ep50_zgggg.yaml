# critical_batch D563 (Joaquin 2026-11-25: "repeat these trainings at ~50 epochs ... retuning some HPs"): tp_zng_d1e4_muon_b128_zgggg
# at 50 epochs of its 1e4 events (3906 steps at batch 128, was 31250), the same space, seed, waves and trial count;
# the lr window set by HPO rule 2 (see its search_space line); everything else as tp_zng_d1e4_muon_b128_zgggg.
# zng_uq_benchmark D507 protocol follow-up ('...go with less data, say 1e4 points.'): one cell of the 2x2
# {MuonAdamW+WSD, Adam+plateau} x {batch 2048, 128} at 1e4 training events of Z+4g, 400 epochs (31250 steps at
# batch 128), MuonAdamW; single-fidelity DyHPO over the B1 template's space, 8 trials, waves 3,3,2, mu_mse selection.
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 32G   # 3e6-event recipe pools in memory, float64 (the 8 runs at job_kit.sh's 32G)
  cpus_per_task: 4
  requirements: 'regexp("A100|H100", TARGET.GPUs_DeviceName) && !regexp("MIG", TARGET.GPUs_DeviceName)'   # HTCondor only: float64 trials on a Tesla T4 ran 3-6x slower (trial_0833 0.225 s/step against 0.036-0.074 on A100/H100)
  time: "00:40:00"   # need ~0.2 h per trial: the 400-epoch trials ran 0.086 s/step at batch 128 on V100 (registry), plus the 250-step sigma stage and start-up
paths: null
sweep_name: tp_zng_d1e4_muon_b128_ep50_zgggg
base_config: ${PROJECT_DIR}/runs/kit/kit_A_uq_zgggg_me2_n500000_t12500
n_trials: 19   # the trial count of tp_zng_d1e4_muon_b128_zgggg (its collected trials, d507_search_v2.json / ft_bcrit.json)
dyhpo:
  surrogate: gp
  n_candidates: 2000
  objective_scale: auto
  seed: 42
  n_startup: 3
  total_budget: 10000
  waves: [3, 3, 2, 3, 3, 2, 3]
fidelity_schedule:
  t_steps: [3906]
fixed_params:
  data.source: recipes
  data.processes_file: ${PROJECT_DIR}/runs/kit/recipes/kit_A_uq_zgggg_me2_n500000_t12500.yaml
  data.train_subsample: 10000
  data.internal_mass_pdgs: '[23,6,25,24]'
  data.eval_subsample: 'null'
  data.memmap: 'false'
  training.dtype: float64
  training.heterosc_select: mu_mse
  evaluation.train_subsample: 2000
  seed: 42
  plot: 'true'
  warm_start_idx: 'null'
  fine_tune.pretrained_path: 'null'
  training.optimizer: MuonAdamW
  training.scheduler: WSD
  training.wsd_cooldown_frac: 0.125
  training.validate_frac: 0.02
  training.batchsize: 128
range_extension:
  enabled: false
search_space:
- {name: training.lr, type: float_log, low: 9.760e-03, high: 8.784e-02}   # Muon centres on its own search: tp_zng_d1e4_muon_b128_zgggg best lr 0.009237 x 3.1701 (surface lr*(t,1e4) from 31250 to 3906 steps), +-1/2 decade
- {name: training.muon_weight_decay, type: float_log, low: 1.0e-03, high: 0.3}
- {name: training.regularization_lambda, type: float_log, low: 1.0e-10, high: 1.0e-06}
- {name: training.cosanneal_warmup_frac, type: float_uniform, low: 0.05, high: 0.2}
- {name: training.cosanneal_eta_min, type: float_log, low: 1.0e-10, high: 1.0e-07}
- {name: ema, type: categorical, choices: ["false", "true"]}
- {name: training.ema_decay, type: float_uniform, low: 0.9, high: 0.999}
