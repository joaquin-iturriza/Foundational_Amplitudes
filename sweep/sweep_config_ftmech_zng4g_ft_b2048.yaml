# finetune_mechanism (D515: the open points on Z+4g): arm (1), today's template fine-tune restart (D423: the W parent
# FA-ccin2p3-47e14eae's final post-sigma model, fresh optimizer, MuonAdamW + WSD, full lr) on the D507 Muon b2048 cell.
# Copy of sweep_config_tp_zng_d1e4_muon_b2048_zgggg.yaml (data, 1e4 events, steps, space incl. the widened lr window,
# 16 trials, waves, seed) with only the start changed: the parent's weights and its two input flags (D392, part of
# its architecture; the scratch control ftmech_zng4g_scrflags_* measures them alone). lr searched directly (lr_scale 1).
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 32G   # 3e6-event recipe pools in memory, float64 (the 8 runs at job_kit.sh's 32G)
  cpus_per_task: 4
  requirements: 'regexp("A100|H100", TARGET.GPUs_DeviceName) && !regexp("MIG", TARGET.GPUs_DeviceName)'   # HTCondor only: float64 trials on a Tesla T4 ran 3-6x slower (trial_0833 0.225 s/step against 0.036-0.074 on A100/H100)
  time: "01:00:00"
paths: null
sweep_name: ftmech_zng4g_ft_b2048
base_config: ${PROJECT_DIR}/runs/kit/kit_A_uq_zgggg_me2_n500000_t12500
n_trials: 24
dyhpo:
  surrogate: gp
  n_candidates: 2000
  objective_scale: auto
  seed: 42
  n_startup: 3
  total_budget: 10000
  waves: [3, 3, 2, 3, 3, 2, 3, 3, 2]
fidelity_schedule:
  t_steps: [1953]
fixed_params:
  data.source: recipes
  data.processes_file: ${PROJECT_DIR}/runs/kit/recipes/kit_A_uq_zgggg_me2_n500000_t12500.yaml
  data.train_subsample: 10000
  data.internal_mass_pdgs: '[23,6,25,24]'
  data.eval_subsample: 'null'
  data.memmap: 'false'
  training.dtype: float64
  training.heterosc_select: mu_mse
  evaluation.train_subsample: 2000
  seed: 42
  plot: 'true'
  warm_start_idx: 'null'
  fine_tune.pretrained_path: ${PROJECT_DIR}/runs/data_saving/dsave_parent_finale_zng_uq_w_lr1p89e-3_cc/models/model_run0_best.pt.gz
  fine_tune.target_stats: own
  fine_tune.offshell_stats: parent
  fine_tune.lr_scale: 1.0
  fine_tune.layer_decay: 1.0
  model.input_soft_eps: 1.0e-08
  model.input_pair_logs: 7
  training.optimizer: MuonAdamW
  training.scheduler: WSD
  training.wsd_cooldown_frac: 0.125
  training.validate_frac: 0.02
  training.batchsize: 2048
range_extension:
  enabled: false
search_space:
- {name: training.lr, type: float_log, low: 1.0e-03, high: 4.1e-02}   # bottom 3.1e-3 lowered 2026-11-21 (step 3: ft best at the bottom)
- {name: training.muon_weight_decay, type: float_log, low: 1.0e-03, high: 0.3}
- {name: training.regularization_lambda, type: float_log, low: 1.0e-10, high: 1.0e-06}
- {name: training.cosanneal_warmup_frac, type: float_uniform, low: 0.05, high: 0.2}
- {name: training.cosanneal_eta_min, type: float_log, low: 1.0e-10, high: 1.0e-07}
- {name: ema, type: categorical, choices: ["false", "true"]}
- {name: training.ema_decay, type: float_uniform, low: 0.9, high: 0.999}
