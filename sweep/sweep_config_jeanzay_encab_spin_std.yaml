cluster:
  request_gpus: 1
  cpus_per_task: 8
  scheduler: slurm
  time: 00:30:00
  auto_submit: false
dyhpo:
  n_candidates: 300
  n_startup: 8
  seed: 42
  total_budget: 10000
fidelity_schedule:
  t_steps:
  - 250
n_trials: 20
fixed_params:
  data.source: files
  data.data_path: ${PROJECT_DIR}/data_small_encab/
  data.preprocess_per_dataset: 'true'
  data.subsample: 'null'
  model: lloca
  model.net.num_blocks: 8
  model.net.num_heads: 8
  evaluation.batchsize: 8192
  plot: 'false'
  seed: 42
  training.batchsize: 1024
  training.get_ID: 'false'
  training.loss_aggregation: geometric_mean
  training.regularization: L2
  training.save_intermediate: 'false'
  training.scheduler: CosineAnnealingLR
  training.validate_frac: 0.05
  training.validate_every_n_steps: 50
  training.dtype: float32
  use_mlflow: 'false'
  data.spin_onehot: 'true'
  data.standardize_props: 'true'
paths:
  sweep_dir: ${PROJECT_DIR}/sweeps/encab_comparison
range_extension:
  enabled: false
search_space:
- name: training.lr
  type: float_log
  low: 0.0001
  high: 0.01
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-11
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.0
  high: 0.2
- name: training.cosanneal_eta_min
  type: float_log
  low: 1.0e-11
  high: 1.0e-06
- name: training.ema_decay
  type: float_uniform
  low: 0.9
  high: 0.9999
sweep_name: encab_spin_std
