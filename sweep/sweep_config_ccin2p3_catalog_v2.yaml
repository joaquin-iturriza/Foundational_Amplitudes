# catalog_v2 joint pretraining: the bigrun_baseline setup (448-process run, docs/results.tex
# sec:bigrun) carried over unchanged except for the two adopted ablations (no diagram encoder,
# no MLP embedder), the data: recipes/catalog_v2_train_scan.yaml (478 pools, mixture sampling), and
# the encoding: the property table with the generator's masses and the generation one-hot
# (data.generation_onehot, a third difference from the bigrun; see docs/results.tex, catalog_v2 census).
# Horizon and batch size are the bigrun's (t = 8601 steps at bs 16384, ~3.3 passes over the
# 42.7M train events), so the lr centre is the bigrun's best trial, 4.1e-3, swept +/- half a decade.
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 64G                   # 42.7M events in memory + per-dataset preprocessing copies
  cpus_per_task: 8
  time: "06:00:00"           # bigrun took ~3.5 h per trial on Jean Zay V100s; margin for this node class
paths:
sweep_name: catalog_v2_pretrain
n_trials: 8
dyhpo:
  n_candidates: 300
  seed: 42
  n_startup: 3               # 3 sequential waves (sweep_manager default): waves 2-3 see observations
  total_budget: 10000
fidelity_schedule:
  t_steps: [8601]            # single fidelity, the bigrun horizon
fixed_params:
  data.source: recipes
  data.processes_file: ${PROJECT_DIR}/recipes/catalog_v2_train_scan.yaml
  data.require_cache: 'true'
  data.train_subsample: 'null'
  data.eval_subsample: 2000
  data.preprocess_per_dataset: 'true'
  data.seed: 42
  data.use_PIDs: 'false'
  data.spin_onehot: 'true'
  data.color_onehot: 'true'
  data.prop_is_massless: 'true'
  data.standardize_props: 'true'
  data.generation_onehot: 'true'      # fermion generation one-hot (d vs s, u vs c)
  data.mass_from_momenta: 'true'
  data.coupling_scalars: 'true'
  data.internal_mass_scalars: 'true'
  data.offshell_per_event: 'true'
  data.internal_mass_pdgs: '[23,6,25]'
  model: lloca
  model.use_diagrams: 'false'          # adopted at scale (tab:bigrun_arms): -35% GM
  model.particle_encoder_hidden: 0     # adopted at scale: no MLP embedder
  model.net.num_heads: 8
  model.net.num_blocks: 8
  seed: 42
  training.batchsize: 16384
  evaluation.batchsize: 16384
  training.loss_aggregation: geometric_mean
  training.val_aggregation: geometric_mean   # the metric (val_loss_no_reg, objective) never
                                             # follows the training-side aggregation knobs
  training.regularization: L2
  training.scheduler: CosineAnnealingLR
  training.get_ID: 'false'
  training.save_intermediate: 'false'
  training.validate_frac: '0.01'
  training.dtype: float32
  plot: 'true'
  use_mlflow: 'false'
range_extension:
  enabled: false
search_space:
- name: training.lr
  type: float_log
  low: 1.4e-03               # [c/3, 3c] around the bigrun best, c = 4.1e-3
  high: 1.2e-02
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-10
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.05
  high: 0.2
- name: training.cosanneal_eta_min
  type: float_log
  low: 1.0e-10
  high: 1.0e-07
- name: ema
  type: categorical
  choices: ["false", "true"]
- name: training.ema_decay
  type: float_uniform
  low: 0.9
  high: 0.9999
- name: training.loss_aggregation_tau   # tau-floored geometric mean, TRAINING loss only
  type: float_log                        # (docs/results.tex tab:agg_ab): the threshold between
  low: 1.0e-03                           # "done" and "still counts"; tau -> large is the
  high: 1.0                              # arithmetic mean. The validation metric stays fixed.
