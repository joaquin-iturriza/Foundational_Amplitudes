# DyHPO single-fidelity sweep over the L2 online-generation BBB hyperparameters, to give the
# full-network Bayes-by-backprop epistemic-sigma arm a FAIR best-vs-best shot against the het-head
# sigma baseline on ee->uugg (het-sigma best deep-IR MSE ~0.0265; base ~0.030). Objective = held-out
# deep-IR (y_min<1e-3) MSE of the predictive mean (written by l2_online_uugg --result_path).
cluster:
  scheduler: slurm
  auto_submit: false
  partition: gpu_p2
  account: itg@v100
  request_gpus: 1
  cpus_per_task: 8
  time: "01:10:00"

paths:
  sweep_dir: /lustre/fswork/projects/rech/itg/ulm49ia/Foundational_Amplitudes/worktrees/wt-harder-div/sweeps
  project_dir: /lustre/fswork/projects/rech/itg/ulm49ia/Foundational_Amplitudes/worktrees/wt-harder-div
  setup_commands:
    - "module load anaconda-py3/2023.09"
    - "conda activate /lustre/fswork/projects/rech/itg/ulm49ia/conda/envs/foundational"

sweep_name: l2_bbb_uugg
n_trials: 12
# drive the L2 online-generation BBB loop, not run.py:
trial_script: sweep/l2_bbb_trial.py
l2_driver: /lustre/fswork/projects/rech/itg/ulm49ia/Foundational_Amplitudes/worktrees/wt-harder-div/analysis/divergences/l2_online_uugg.py

dyhpo:
  n_candidates: 200
  seed: 42
  n_startup: 6           # narrowed 3-HP space -> fewer startup points (rule #5)
  total_budget: 10000
  failure_fallback: 1.0

# SINGLE fidelity (rule #6): one t_steps = the full run length.
fidelity_schedule:
  t_steps: [4000]

fixed_params:
  process: uugg
  arm: bbb
  n_total: 300000
  rounds: 10
  oversample: 4
  bbb_ksamples: 8        # scoring/eval posterior samples (8 keeps trials ~35 min, vs 16)
  seed: 0
  y_lo: 1.0e-6
  mix_ir: 0.5

# BBB knobs only (lr / reg / warmup are the validated finetune values baked into the driver).
search_space:
- name: bbb_beta         # ELBO KL weight (loss += beta*KL/N)
  type: float_log
  low: 1.0e-05
  high: 1.0e-01
- name: bbb_sigma_rel    # initial posterior std as a fraction of the muP weight scale
  type: float_log
  low: 5.0e-03
  high: 1.5e-01
- name: gamma            # keep-rule exponent p(x) ∝ sigma_epi^gamma
  type: float_uniform
  low: 1.0
  high: 5.0
