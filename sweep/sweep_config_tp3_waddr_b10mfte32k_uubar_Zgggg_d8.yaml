# Add-W child, replay parents only (D34): fine-tune from replay 10%, 2k, trial 68, its best checkpoint on all 30 (step 2000) (runs/tp3_waddm_buf10pc2k/trial_0068): uubar_Zgggg on D = 10^4
# events, 32k steps, at the finale cell's own two points (its trial indices in expect_tp3.json, added with
# generate_sweep --extend --fixed-hp; for Z+3g those are rung 9's 32k chosen points, not D25's). Copied from sweep_config_tp3_finfte32k_uubar_Zgggg_d8.yaml (same
# DyHPO seed, hence the same candidate pool), parent path changed.
cluster:
  scheduler: slurm
  auto_submit: false
  request_gpus: 1
  mem: 8G
  cpus_per_task: 4
  chain_width: 2
  time: 08:00:00
paths: null
sweep_name: tp3_waddr_b10mfte32k_uubar_Zgggg_d8
n_trials: 5
dyhpo:
  n_candidates: 200
  seed: 1056477226
  n_startup: 3
  total_budget: 10000
fidelity_schedule:
  t_steps:
  - 32000
fixed_params:
  data.source: recipes
  data.require_cache: 'false'
  data.eval_subsample: 10000
  data.phase_space_on_pool: 'true'
  data.preprocess_per_dataset: 'true'
  data.signedlog_quantile: 0.01
  data.seed: 42
  data.use_PIDs: 'false'
  data.spin_onehot: 'true'
  data.color_onehot: 'true'
  data.prop_is_massless: 'true'
  data.standardize_props: 'true'
  data.generation_onehot: 'true'
  data.generation_feature: 'true'
  data.mass_from_momenta: 'false'
  data.coupling_scalars: 'true'
  data.internal_mass_scalars: 'true'
  data.offshell_per_event: 'true'
  data.target_propagators: 'false'
  data.target_propagator_tchannel: 'false'
  data.target_propagator_tchannel_max_final: 2
  data.internal_mass_pdgs: '[23,6,25]'
  model: lloca
  model.use_diagrams: 'false'
  model.particle_encoder_hidden: 0
  model.net.num_heads: 8
  model.net.num_blocks: 8
  seed: 42
  training.batchsize: 16384
  evaluation.batchsize: 16384
  evaluation.train_subsample: 2000
  training.loss_aggregation: mean
  training.sign_head: 'true'
  training.val_aggregation: geometric_mean
  training.regularization: L2
  training.scheduler: CosineAnnealingLR
  training.get_ID: 'false'
  training.save_intermediate: 'false'
  training.validate_frac: '0.01'
  training.es_load_best_model: 'true'
  training.dtype: float32
  plot: 'true'
  use_mlflow: 'false'
  data.processes_file: ${PROJECT_DIR}/recipes/transfer_probe_uubar_Zgggg.yaml
  data.train_subsample: 10000
  fine_tune.lr_scale: 1.0
  fine_tune.layer_decay: 1.0
  fine_tune.pretrained_path: ${PROJECT_DIR}/runs/tp3_waddm_buf10pc2k/trial_0068/models/model_run0_best_all.pt
  fine_tune.target_stats: own
  fine_tune.offshell_stats: parent
range_extension:
  enabled: false
search_space:
- name: training.lr
  type: float_log
  low: 0.001
  high: 0.01
- name: training.regularization_lambda
  type: float_log
  low: 1.0e-10
  high: 1.0e-06
- name: training.cosanneal_warmup_frac
  type: float_uniform
  low: 0.05
  high: 0.2
- name: training.cosanneal_eta_min
  type: float_log
  low: 1.0e-10
  high: 1.0e-07
- name: ema
  type: categorical
  choices:
  - 'false'
  - 'true'
- name: training.ema_decay
  type: float_uniform
  low: 0.9
  high: 0.999
