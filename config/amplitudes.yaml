exp_type: amplitudes
exp_name: amp

data:
 # Data source: "files" (default) loads pre-generated .npy from data_path and
 # splits each positionally by train_test_val. "recipes" instead materializes
 # explicit per-role pools on demand from the MG5 generator (frozen, persistent
 # val/test; purgeable train cache) — see the `processes` block below.
 source: files
 dataset : ["ee_wwz_255-1000GeV_amplitudes","ee_WW_162-1000GeV_amplitudes","ee_ttbar_346-1000GeV_amplitudes","ee_uug_91-1000GeV_amplitudes","ee_uugg_91-1000GeV_amplitudes","ee_aa_10-1000GeV_amplitudes","ee_aaa_10-1000GeV_amplitudes","ee_uu_91-1000GeV_amplitudes"]
 data_path : data/
 # Recipe data path (used only when source: recipes). Each process carries its
 # own √s range and per-role event counts; normalization is fit on train only,
 # frozen, and saved to the run dir. amp_orders is taken from the process
 # definition unless overridden per entry.
 seed: 42
 # Amplitude preprocessing scope (recipe path): true (default) normalizes each
 # process to its own unit scale independently; false fits ONE train-only
 # signedlog+standardization scale across all processes, preserving the relative
 # magnitude differences between them. Momentum normalization stays global in
 # both cases. Per-dataset is the validated default — ~6x lower raw relative
 # error at the median and far less HP-sensitive than global (global starves the
 # small/complex processes by letting large-amplitude ones dominate the loss);
 # the advantage grows with data. See sweeps/preproc_comparison.
 preprocess_per_dataset: true
 signedlog_quantile: 0.01   # signed pools (one-loop finite parts that change sign) use
                            # sgn(x) log(1+|x|/s) with s this quantile of |x| on the train
                            # pool, stored in the transform string (signedlog:<s>); without
                            # the scale the transform is linear below |x|=1 and the
                            # standardized target has a kurtosis of thousands. Positive
                            # pools keep the plain log, so their numbers do not move.
 # Per-process recipe spec. Either inline as `processes` (a list of dicts) or via
 # `processes_file` (path to a YAML/JSON list — easier to thread through a sweep).
 # Each entry: {name, sqrts: [min, max], n_train, n_val, n_test[, amp_orders]}.
 processes: null
 processes_file: null
 # Cache-only guard: when true (default), a recipe run never generates data
 # inline — it expects the datasets to have been prebuilt by the CPU prebuild job
 # (`sbatch prebuild_recipes.sh <spec>`) and fails fast otherwise, so GPU time is
 # never spent materializing data. Set false to allow inline generation (e.g. a
 # quick local/dev run without a separate prebuild step).
 require_cache: true
 # Per-dataset load caps (recipe path): the frozen pools may hold far more than a
 # single run trains on (e.g. 10M/process). Only this many train / val+test events
 # per process are pulled into memory (mmap slice — the full file is never read).
 # null = load the whole pool.
 train_subsample: null
 eval_subsample: null
 # Example inline form:
 #   - {name: ee_uu,    sqrts: [91, 1000],  n_train: 1_000_000, n_val: 100_000, n_test: 100_000}
 #   - {name: ee_uug,   sqrts: [91, 1000],  n_train: 2_000_000, n_val: 100_000, n_test: 100_000}
 #   - {name: ee_ttbar, sqrts: [346, 1000], n_train: 1_000_000, n_val: 100_000, n_test: 100_000}
 subsample : null
 include_permsym: true
 train_test_val: [.4, .5, .1]
 no_props: false
 trafos: {}   # dict (was []): preprocess_particles does `if trafos: trafos.items()`, so an
              # empty dict is functionally identical (both falsy) but permits a dict override.
              # Only used by the LEGACY non-LLoCa path; LLoCa never reads it.
 amp_trafos:
  - log
  - standardization
 incl_fvs: false
 use_PIDs: false  # false: 9D physical property vector; true: one-hot PDG token index (legacy)
 # Smart-encoding transforms of the physical property vector (use_PIDs: false only).
 # These widen the encoder's INPUT, not n_scalars (see particle_ids.build_property_matrix),
 # so changing them invalidates warm-start from checkpoints trained under a different set.
 # spin_onehot + prop_is_massless + standardize_props + color_onehot are all on by default;
 # they encode particles by quantum numbers (labels one-hot, magnitudes standardized). color
 # and the MLP encoder (particle_encoder_hidden>0) showed no big gain on short/small A/B runs
 # but are expected to help on richer data / longer training, so they are kept ON by default.
 spin_onehot: true         # one-hot the categorical spin column
 color_onehot: true        # one-hot the SU(3) color representation (rep identity). Same
                           # reasoning as spin_onehot (color is a label, not a magnitude);
                           # on by default. It was neutral on short/small A/B runs, but is
                           # expected to help on richer data / longer training (open — drop
                           # only if a rigorous test shows it hurts).
 generation_feature: true  # keep the generation column at all (false = the pre-generation encoding, for A/Bs)
 generation_onehot: true   # one-hot the fermion generation. The table's masses are the
                           # generator's (u,d,s,c,e,mu massless), so generation is the only
                           # thing separating d from s and u from c; same-generation pairs
                           # (ud, cs) exchange a W, cross-generation ones (us) do not.
 prop_is_massless: true    # explicit "exactly massless" flag + neutralise mass sentinel
 standardize_props: true   # z-score the continuous property columns
 # Replace the frozen log10_mass_gev table column with each particle's on-shell mass
 # m=sqrt(E^2-|p|^2) from its 4-momentum — faithful to the dataset's actual masses
 # (recipe path or single-dataset legacy path; use_PIDs must be false).
 mass_from_momenta: false
 # Feed a global per-event coupling scalar [log(alpha_QED), log(alpha_QCD)] (broadcast
 # like amp_orders) so coupling reaches the model even with model.use_diagrams=false.
 # Coupling VALUES come from each dataset's recipe `physics`/`couplings` block.
 coupling_scalars: false
 # Feed a per-dataset INTERNAL-mass scalar log(mass) for each PDG in internal_mass_pdgs
 # (broadcast like amp_orders). For a propagator/resonance that is NOT an external leg,
 # so its mass is absent from the momenta and mass_from_momenta cannot see it — the
 # internal-mass analog of coupling_scalars. Values come from each dataset's recipe
 # physics.masses block (table mass as fallback).
 internal_mass_scalars: false
 internal_mass_pdgs: []          # e.g. [23] to feed the scanned Z-propagator mass
 # Diagnostic: when true, the internal_mass slot is filled PER-EVENT with the
 # resonance argument (√s − m) instead of the per-dataset log-mass — i.e. do the
 # kinematic×mass interaction for the model, to test whether that interaction (not
 # the info) is what a plain internal-mass scalar can't learn. Needs internal_mass_scalars.
 resonance_per_event: false
 # Production internal-mass conditioning: fill the internal_mass slot PER-EVENT with the
 # propagator OFF-SHELLNESS s_prop − M² fed DIRECTLY to the main transformer (not through
 # the diagram encoder, which dilutes it). Generalizes resonance_per_event's proven
 # s-channel √s−M result to arbitrary propagator topology via the diagram masks +
 # scanned propagator masses: one column per internal_mass_pdgs entry, the nearest-pole
 # propagator of that PDG; signed-log + unit-std. Needs internal_mass_scalars + a diagram
 # sidecar per process. Takes precedence over resonance_per_event when both are on.
 # VALIDATED (focused levers A/B, full data, 30k it, val_loss_no_reg): resolves the
 # internal-mass regress-to-mean U-shape that the no-feature baseline cannot — s-channel
 # Z ~1.6 → ~1e-6..1e-4, top 0.42 → 5.4e-2, Z-in-4ℓ 0.17 → 5.9e-2, Higgs(H→ττ) 0.10 →
 # 7.7e-2 (weak: Z→ττ swamps the τ-Yukawa). Production setting for the big-run pretrain:
 # internal_mass_scalars=true, offshell_per_event=true, internal_mass_pdgs=[23,6,25].
 # Off by default (opt-in) since it needs the recipe path + diagram sidecars.
 offshell_per_event: false
 # Target-side propagator subtraction: every event's |M|² is multiplied by
 # Π_k ((s_k − M²)² + M²Γ²)/M⁴ over the process's propagators carrying target_propagator_pdgs
 # (Breit–Wigner denominators; the scanned mass where a scan sets it), so the log target is the
 # smooth remainder; undone exactly at evaluation (raw metrics on the true |M|²). Needs the
 # diagram sidecars like offshell_per_event. Widths: the MadGraph sm model defaults.
 target_propagators: false
 target_propagator_pdgs: [23, 24, 6, 25]
 target_propagator_widths: {23: 2.4414, 24: 2.0476, 6: 1.5083, 25: 0.006382}
 target_propagator_straddle: 0.005   # a propagator counts only if its s_k straddles M² on the train pool
 target_propagator_tchannel: false   # also |t|^p for massless t-channel exchanges (p = 1 fermion, 2 boson)
 target_propagator_tchannel_max_final: 99   # t-channel factor only for processes with up to this many final particles
 # Coupling-order vector per dataset: [L_QCD, L_EW, alpha_s_max, alpha_ew_max] of the
 # stored target (mg5_pipeline_final.order_vector). null => derived from the catalog
 # entry of each dataset (recipe path), or from the dataset name (files path).
 # Set an explicit length-matched list only to override; legacy 2-vectors are widened.
 amp_orders: null

train: true
training:
 iterations: 2500000 # MLP, DSI: 2500000; Tr: 1000000; GAP, GATr, CGENN: 250000
 optimizer: AdamW
 lr: 1e-4
 batchsize: 16384        # decided operating point (biggest BS that fits); see config/default.yaml
 validate_every_n_steps: 100
 validate_frac: 0.01     # overrides validate_every_n_steps: 100 val points regardless of horizon
 clip_grad_norm: 1000
 scheduler: CosineAnnealingLR

plot: true
plotting:
 histograms: true
 delta: true
 delta_prepd: true

defaults:
 - _self_
 - model: lloca
 - default
 - local: none   # override with `local=desktop` on your Windows machine