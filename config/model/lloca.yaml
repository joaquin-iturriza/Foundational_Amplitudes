_target_: wrappers.AmplitudeLLoCaWrapper

token_size: 0
d_particle_hidden: 16  # fixed projection dim: encoder(n_features → d_particle_hidden).
                        # in_channels = d_particle_hidden + 4 is constant regardless of
                        # how many quantum numbers are in PARTICLE_PROPERTIES, so adding
                        # a 9th feature never requires retraining the transformer.
particle_encoder_hidden: 0   # off (docs/results.tex tab:bigrun_arms, not load-bearing). >0 → 2-layer MLP encoder (Linear→GELU→Linear) instead of a
                             # single Linear, so it can form nonlinear products of quantum
                             # numbers. 0 = legacy single Linear.

# --- Per-process context vector (D105; CAVIA, arXiv:1909.09157) ---------------
# context_dim > 0: a learned row c_p per training process ADDED to every particle's encoded properties
# (wrappers.setup_context; must equal d_particle_hidden). In training each event's c_p is zeroed with probability
# context_dropout, so the zero vector is the zero-shot model; a held-out process gets c_p fitted on K labelled events
# with everything else frozen (tools/kshot_context.py). The table's processes are written to
# <run_dir>/context_names.json; a run warm-started from it (fine_tune.pretrained_path) reads that file.
context_dim: 0
context_dropout: 0.5
context_names_file: null

# --- Feynman-diagram conditioning (arXiv:2606.23791 graph route) ---------------
# Off by default (docs/results.tex tab:bigrun_arms: removing it lowers the geometric mean by a
# third and raises the 90th percentile; to be retried once the catalog pretraining is understood,
# catalog hand-off). A graph encoder embeds each process's diagram set into a d_diag
# vector E(process), broadcast to every particle and concatenated into the scalar
# features exactly like the coupling-order labels (equivariant: E is a Lorentz
# scalar). Requires use_PIDs=false and data/diagrams/<process>.diagrams.json
# (tools/dump_diagrams.py); processes with a missing sidecar degrade gracefully to a
# zero embedding. Set true to try it (also changes in_channels, so
# a checkpoint trained with one setting cannot warm-start the other).
use_diagrams: false
# --- Pairwise attention bias (diagram-derived, independent of use_diagrams) -----
# Reads the same data/diagrams/*.diagrams.json sidecars, but instead of an input
# embedding, each internal propagator's per-event off-shellness s−m² (signed-log,
# standardized) drives a small zero-init MLP whose per-head output is ADDED to the
# attention logits of every particle pair inside the propagator's resonating
# cluster (the smaller side of the cut; both sides on a tie). Puts the pole
# variable where the pair correlation lives, directly in the main transformer.
# Zero-init head ⇒ exactly the baseline at step 0. Requires use_PIDs=false.
use_pair_bias: false
pair_bias_hidden: 16      # hidden width of the per-propagator score MLP (1 → H heads)
pair_bias_clamp: 4.0      # clamp the standardized off-shellness to ± this (sigma units)
pair_bias_max_props: 48   # cap propagators/process (smallest clusters + massive first)
pair_bias_logit_cap: 8.0  # soft cap (cap·tanh(x/cap)) on the per-head bias logits; the
                          # uncapped v1 arm drifted to −17-logit hard masks that hurt
                          # the converged bulk. 0 disables the cap.
diagram_scanned_mass: false    # override the propagator's mass column per-dataset with the
                               # SCANNED internal mass (data.internal_mass_pdgs), so a mass
                               # scan reaches the diagram (else the table mass is stale). With
                               # use_diagram_virtuality, the encoder gets scanned-mass + per-event
                               # virtuality on the SAME propagator edge (local off-shellness).
use_diagram_virtuality: false  # Tier B: feed per-event propagator virtuality s=(Σp)² on
                               # internal edges (requires use_diagrams). The pole structure
                               # 1/(s-m²); per-event, so slower than the static topology embed.
virt_standardize: true         # z-score signed-log(s) (calibrated on the first batch, stored as
                               # buffers) + clamp tails — the raw feature is wide/bimodal
                               # (s-channel +9..+19, t-channel -8..-19) and destabilises training
virt_clamp: 4.0               # clamp the standardised virtuality to +/- this (sigma units)
virt_log_scale: 0.1            # legacy fixed scale used only when virt_standardize=false
virt_mode: edge               # "edge": virtuality is a per-event graph edge feature (re-encodes
                              # per event). "pool": encode topology once + virtuality only weights
                              # the diagram pooling (~Tier A cost, a different/faster model).
d_diag: 32                   # width of E appended to n_scalars (and num_scalars)
diagrams_dir: data/diagrams  # where the <process>.diagrams.json sidecars live
diagram_encoder:             # graph-transformer hyperparameters (standard-param, off muP axis)
  d_model: 64
  n_heads: 4
  n_layers: 3
  k_pe: 8                     # Laplacian positional-encoding dimension
  max_diagrams: 512          # cap per process (high-multiplicity guard, e.g. qqbar_Zgggg)
# Which encoder use_diagrams turns on. "ours": the one above (models/diagram_encoder.py; property
# features, coupling orders, Tier B; E appended to the scalar features, d_diag wide). "llm4lhc":
# arXiv:2606.23791's encoder (models/diagram_encoder_llm4lhc.py; node types + LapPE, learned
# particle-label edge terms of their Eq. 19), its vector ADDED to every particle's token
# embedding (after linear_in), n_scalars unchanged; d_diag, diagram_encoder, the virtuality and
# scanned-mass options do not apply. Needs a sidecar for every process.
diagram_encoder_impl: ours
diagram_encoder_llm4lhc:     # their defaults (config/graph_pooled.yaml, App. B)
  mode: pooled               # pooled | pooled_external (per_diagram has no injection site here)
  hidden_size: 256           # encoder width (SP, fixed); out_proj maps it to the backbone width
  num_layers: 3
  num_heads: 4
  laplacian_pe_dim: 8
  dropout: 0.0
  edge_feature_mode: bias_kv # bias | bias_kv
  max_diagrams: null         # their default: every diagram (the old encoder caps at 512)
  bsm_labels: false          # edge labels for catalog_v3's BSM particles (Y1, h2, h3, H+-); on for a catalog with them
net:
  _target_: models.lloca.LLOCAMuPTransformer

  num_scalars: null
  hidden_channels_mlp: 128
  num_layers_mlp: 2

  in_channels: null
  attn_reps: "8x0n+2x1n"
  out_channels: 1
  num_blocks: 8
  num_heads: 8
  freeze_framesnet: false
  causal_mask: false         # autoregressive attention within each event: particle i attends to 1..i (draft Sec. 5,
                             # "Extrapolating to more legs"); pair with data.particle_order
  causal_frames: prefix      # with causal_mask: "prefix" = particle i's local frame from particles 1..max(i, K) only
                             # (no leak of later particles through the frames net), "full" = from the whole event
  causal_frames_min: 4       # K: the first K particles see each other in the frames net (a frame needs three
                             # independent directions; 4 = the smallest events, 2 -> 2, which stay complete)
  bayesian_last_layer: false # BNN last layer (draft Sec. 5, fig:bnn): net.linear_out -> variational μP readout
                             # (models/bayesian_readout.py, the Heidelberg VBLinear); KL/N_train joins the training
                             # loss (never the *_no_reg losses), evaluation uses the posterior-mean weights
  bnn_prior_prec: 1.0        # 1/sigma_prior^2 of the Gaussian weight prior (VBLinear default)
  bnn_logsig2_init: -9.0     # init of the posterior log-variance, N(-9, 0.001) (VBLinear default)
  checkpoint_blocks: false   # gradient-checkpoint transformer blocks: recompute block
                             # activations in backward instead of storing them — large
                             # activation-memory saving for ~one extra forward of compute.


  loss: ${training.loss}   # HETEROSC -> net emits 2 channels (mean, softplus sigma); else 1
  sigma_after_pool: true     # HETEROSC: apply softplus ONCE to the POOLED per-event sigma logit
                             # (sigma = softplus(mean_i z_i)), matching the reference impl where the
                             # readout is already per-event. false = old per-particle softplus then
                             # mean-pool (sigma = mean_i softplus(z_i)), which COMPRESSES sigma's
                             # dynamic range -> reliability slope ~1.5, tail under-predicted ~2.75x.
  detach_sigma_backbone: false   # HETEROSC only: sigma reads DETACHED backbone features so
                                 # the backbone gets only mu's (pure-MSE, beta=1) gradient and
                                 # sigma is a read-only calibration head. Fixes the mu underfit
                                 # from (mu,sigma) multi-task interference on easy single-process
                                 # finetunes. Warm-start compatible (same weights).