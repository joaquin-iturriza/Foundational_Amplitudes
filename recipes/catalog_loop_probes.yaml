# the order axis of the dimensionless round (D93, "perturbative order: the one-loop probes"): every one-loop pool on CC
# (QCD and electroweak virtuals, loop-induced; both initial states) whose |M|^2 is positive on every val event, one window
# per process name (the widest: predictions are saved per name), 55 pools, with the tree pool of the same process and
# window where one exists (46). The 51 signed one-loop pools are left out: a log|M|^2 model cannot score a target that
# changes sign (tools/zero_shot_parent.py lists them). Counts are the existing pools' (trees without a uniform train pool
# get 1000 train events, read only for the probe's own target statistics). With data.target_physics_orders 77 of the 101
# are scored: mixed-order entries have no single coupling power, the loop-induced uubar_Hg_loop no alpha_s rule.
