# pretrain_data_saving: the held-out one-loop target v4_bbx_avevex_nlo alone (its entry of recipes/catalog_v4_heldout_H5.yaml; its Born is a training tree); the third one-loop target (step 6: q q~ into electroweak bosons and leptons like the other two; V<0 on 1.0% of rows, trained and read through signedlog)
sampling:
  mode: mixture
  f_fwd: 0.15
  fwd_cand: 0.3333333333333333
processes:
- name: v4_bbx_avevex_nlo
  sqrts:
  - 20
  - 6000
  n_train: 50000
  n_val: 5000
  n_test: 5000
