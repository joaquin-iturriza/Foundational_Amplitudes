# Continual add-W with a forgetting curve (D30): W+4g and W+5g trained on, the finale's 28 processes as monitors
# (experiment._monitor_names: scored at every validation on the finale's own pools, never trained on, outside the
# aggregate that selects the checkpoint; model_run*_best_all.pt is the best over all 30). Pools as in
# recipes/transfer_wng_add.yaml and recipes/transfer_finale.yaml.
