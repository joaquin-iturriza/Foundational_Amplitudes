  - {name: udbar_enug__as150,         base: udbar_enug,      sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000, physics: {alpha_s: 0.15}}
  # m_t in {150, 195} GeV: the top family (own standalone per point; Yukawa follows)
  - {name: ee_ttbar__mt150,           base: ee_ttbar,        sqrts: [ 315, 1000], n_train: 100000, n_val: 10000, n_test: 10000, physics: {masses: {6: 150.0}}}
