  - {name: uubar_ddbar__as150,        base: uubar_ddbar,     sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000, physics: {alpha_s: 0.15}}
  - {name: udbar_udbar__as090,        base: udbar_udbar,     sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000, physics: {alpha_s: 0.09}}
