# catalog_v2 parameter-scan layer: a few far-apart points per axis, decorated variants of
# the base entries (the base point itself is in catalog_v2_train.yaml). The physics block is
# the single source of truth for generation (card patches, masses) and the coupling feature.
sampling: {mode: mixture}
processes:
  # alpha_s(M_Z) in {0.09, 0.15}: trees with an alpha_s power (shared backend, alpha_s per event)
  - {name: uubar_gg__as090,           base: uubar_gg,        sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000, physics: {alpha_s: 0.09}}
  - {name: uubar_gg__as150,           base: uubar_gg,        sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000, physics: {alpha_s: 0.15}}
  - {name: uubar_ga__as090,           base: uubar_ga,        sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000, physics: {alpha_s: 0.09}}
  - {name: uubar_ga__as150,           base: uubar_ga,        sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000, physics: {alpha_s: 0.15}}
