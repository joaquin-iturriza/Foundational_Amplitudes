  - {name: uubar_bbbar__as090,        base: uubar_bbbar,     sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000, physics: {alpha_s: 0.09}}
  - {name: uubar_bbbar__as150,        base: uubar_bbbar,     sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000, physics: {alpha_s: 0.15}}
