# Transfer study, star arm (docs/results.tex sec:ladder; the user approved the arms 2026-10-02): rung 1 (ee_uu, mumu,
# numu) plus one structure, not cumulative. No probe is in any arm, nor any process of a probe's equality class
# (analysis/process_equality/equal_processes.json). 1e5 train events per tree process, 5e4 per one-loop; mixture sampling.
# + the quasi-collinear massive limit (b emitting gluons); probe ee_ttbarg (c is massless in the generator, so no ee_ccbarg)
sampling: {mode: mixture}
processes:
  - {name: ee_uu, sqrts: [25, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_mumu, sqrts: [25, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_numu, sqrts: [25, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_bbbarg, sqrts: [25, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_bbbargg, sqrts: [25, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
