  - {name: ee_bbbarg,     sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_ttbarg,     sqrts: [ 363, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_mumua,      sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_tautaua,    sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_uua,        sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_nnbara,     sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  # 2->3, e+e-, three bosons
  - {name: ee_aaa,        sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_WWa,        sqrts: [ 169, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_wwz,        sqrts: [ 265, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_ZZa,        sqrts: [ 191, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_ZZZ,        sqrts: [ 287, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_Zaa,        sqrts: [  96, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  # 2->3, e+e-, Higgs (self-coupling, fusion, Yukawa)
