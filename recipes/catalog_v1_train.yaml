  # ee_aH_loop: NOT CERTIFIED (MadLoop returns a spurious single pole for this tree-less EW
  # process; ee_HH/uubar_Hg/ee_gg certify with poles = 0). Excluded until understood.
  - {name: ee_HH_loop,        sqrts: [ 262, 1000], n_train: 50000, n_val: 5000, n_test: 5000}
  - {name: uubar_Hg_loop,     sqrts: [ 131, 1000], n_train: 50000, n_val: 5000, n_test: 5000}
