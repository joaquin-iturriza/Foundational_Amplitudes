  - {name: uubar_uubarg,  sqrts: [  25, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: uubar_ttbarg,  sqrts: [ 363, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
