  - {name: ee_nnbarWW,        sqrts: [ 169, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
  - {name: ee_nnbarHH,        sqrts: [ 262, 1000], n_train: 100000, n_val: 10000, n_test: 10000}
