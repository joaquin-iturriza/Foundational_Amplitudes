# kit_benchmark, D575 (Bakar's protocol A, pretrained with the target family held out) for e+e- -> u u~ g and u u~ g g
# with the asymptotic-factor (A2) model: recipes/transfer_finale_kit_fairnlo.yaml (the fair one-loop A2 parent's
# recipe, D570/D572) minus the KIT ee_qqg and ee_qqgg families (recipes/gen_kit_pretrain.py: e+ e- with a q q~ pair
# and one or two gluons, any flavour): ee_uug, ee_uugg, ee_bbbarg, ee_bbbargg out. Everything else as that recipe.
