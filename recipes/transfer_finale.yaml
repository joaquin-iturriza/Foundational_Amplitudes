# Transfer study, the finale: rung 9 (cumulative) plus the processes every star arm adds (soft, ISR, dead cone,
# threshold, W pole, EW Sudakov; recipes/transfer_star_<arm>.yaml), 28 processes. No probe of the 18 is in it, nor any
