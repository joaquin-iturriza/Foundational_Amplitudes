# catalog_daniel held-out: their published test_split.json (149 folders) minus the
# 10 2->1 processes (their whole 'Single-particle production' group) = 139.
# No class-based removal on top; catalog_daniel_heldout_norelabel.yaml is the relabel-free subset.
# pp at 13 TeV through MadEvent (their run_card), one run per process: val 10k | test 10k | train
# 100k (they used 1M). Built by prebuild_recipes.py (datagen.ensure_lhe_pp; scripts/job_gen_daniel_catalog.sh).
# sqrts is the hadronic 13 TeV (a label of the pool path), not a sampling window.
