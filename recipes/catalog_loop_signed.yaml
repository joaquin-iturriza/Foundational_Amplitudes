# the sign-changing one-loop pools of the order axis (D93; the user, 2026-10-23: "of course there has to be a way to deal
# with negative values"): the 55 one-loop pools on CC whose target changes sign in some split (the complement of
# catalog_loop_probes.yaml's one-loop pools), every sqrt(s) window, with the tree of the same process and window where one
# exists (48; trees without a uniform train pool get 1000 train events). A catalog model predicts log|M|^2 and has no sign
# output, so the one-loop pools are scored on the magnitude, log max(|M|^2, s) (tools/zero_shot_parent.py
# --signed-magnitude, the sign head's 'abslog' transform); the sign is what stays out of reach. Each pool's fraction of
# negative val events: analysis/catalog_daniel/data/catalog_loop_signed_negfrac.json (computed on CC from the val pools).
# With data.target_physics_orders 61 of the 103 are scored (mixed-order entries refused).
