  title: 'Synthetic prior: alternatives not built'
  question: '(the user''s list of 2026-10-08 and 09; paused with the direction, D43). Built as versions 2 to 6 (Sec. ): quark-generation
    conservation, K growing with multiplicity, vertex legality, the effective ggH vertex, the collinear limit through \langle
    ij\rangle, [ij] factors, spinor-helicity numerators with selection rules. Not built: initial states beyond the catalog''s;
    quartic vertices; soft emission as an eikonal factor times a lower-multiplicity amplitude; one-loop amplitudes from scalar
    integrals (Sec. , plan item (5)); multiplicities well past 2\to4, where MadGraph struggles and the generator does not
    (Sec. ), with a cheaper symmetrisation than the permutation average. How close to real amplitudes the prior should be
    is still to be settled with others.'
