  question: 'The ladder. Rung 6''s hp15 rescored at 1.67\times10^{-7} against the 1.30\times10^{-7} its run recorded (rung
    1''s hp47 reproduces to 1\%); the gap is not understood. Not the EMA weights (FA-ccin2p3-60b47206, 2026-10-25): that rescoring
    predates the EMA-aware loader (rebuild_run.load_best_weights, 2026-10-15) and scored the checkpoint''s live weights, but
    scoring the live and the EMA weights of the same settings (hp15, EMA decay 0.995, on rung 4; rung 6''s own checkpoint
    is pruned) gives 5.62\times10^{-8} live and 5.79\times10^{-8} EMA against 5.81\times10^{-8} recorded, and rung 1''s hp47
    3.58 and 3.62 against 3.62\times10^{-8}: the live weights sit 1 to 3\% below, not 28\% above. Left: the hardware and TF32
    of rung 6''s training on lxplus against the rescoring''s, testable only by rerunning hp15 on rung 6 from its config (\approx6
    GPU-h). Each process''s loss rises at rung 9 at a fixed 64k steps (Fig. ), so the rung comparison mixes structure with
    training per process; the step budget stays 64k on every rung (the user''s call).'
