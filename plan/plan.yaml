    fix: 'Seeds against spread (fails): the expected effect is the search''s 1.05 point gap (2.75% vs 3.8% median held-out
      wrong-sign share, sign_head_search.json zero_shot), and the measured run-to-run spread of that median on the more-signed-pools
      arm is 0.6 to 1.45 points (prep_signed.json seeds: 4.75 vs 3.3, rerun 3.3 vs 3.9), i.e. about 1 point per run; with
      two seeds per arm the seed-mean difference has a spread of about 1 point, so the expected effect is about one standard
      deviation. The yes threshold (gap larger than max(1.45, within-arm differences)) is above the expected effect, and the
      per-pool rule (both pair seeds below both control seeds on 9 of 17 pools) is far stricter still: per-pool run-to-run
      swings are huge (the unchanged rerun moved v3_ddx_ag 38.5% to 2.25% and v3_ddx_aaa 0.45% to 13.6%), so a real 1 point
      effect would almost always come back ''no''. Fix: either enough seeds that the expected 1 point stands above the spread
      (about 6 to 8 per arm by the measured spread; more GPU than the approved two seeds each, so that is the user''s call
      and goes to them as a question with its cost), or a statistic whose measured run-to-run spread on the three existing
